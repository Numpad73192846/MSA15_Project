<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="내 손 안에 손금 - 이메일 로그인">
    <title>이메일 로그인 | 내 손 안에 손금</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="stars" id="stars"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <a href="/" class="logo">🔮 손금</a>
        <a href="/login" class="back-link">← 돌아가기</a>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <section class="login-section">
            <!-- Logo/Title -->
            <div class="login-header">
                <div class="login-icon">✉️</div>
                <h1 class="login-title">이메일로 로그인</h1>
                <p class="login-subtitle">이메일과 비밀번호를 입력하세요</p>
            </div>

            <!-- Error Message -->
            <div th:if="${param.error}" class="error-message">
                <span>❌</span>
                <span>이메일 또는 비밀번호가 올바르지 않습니다.</span>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="login-form">
                <div class="form-group">
                    <label for="username">이메일</label>
                    <input type="email" id="username" name="username" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember-me">
                        <span>로그인 상태 유지</span>
                    </label>
                    <a href="/forgot-password" class="forgot-link">비밀번호 찾기</a>
                </div>

                <button type="submit" class="cta-button login-submit-btn">
                    로그인
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>계정이 없으신가요?</span>
            </div>

            <!-- Signup Link -->
            <a href="/signup/email" class="social-btn email-btn">
                <span>이메일로 회원가입</span>
            </a>

            <!-- Back to Social Login -->
            <a href="/login" class="back-to-social">
                ← 다른 방법으로 로그인
            </a>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2024 내 손 안에 손금. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script>
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        document.addEventListener('DOMContentLoaded', createStars);
    </script>
</body>

</html>
