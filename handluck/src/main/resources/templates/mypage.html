<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="내 손 안에 손금 - 마이페이지">
    <title>마이페이지 | 내 손 안에 손금</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>

<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="stars" id="stars"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <a href="/" class="logo">🔮 손금</a>
        <div class="user-menu">
            <span class="user-name"
                th:text="${#authentication.principal.attributes['name'] ?: #authentication.name}">사용자</span>
            <a href="/logout" class="auth-btn logout-btn">로그아웃</a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container mypage-container">
        <section class="mypage-section">
            <!-- Profile Header -->
            <div class="profile-header">
                <div class="profile-avatar">🔮</div>
                <div class="profile-info">
                    <p class="login-method">
                        <span class="login-icon">✨</span>
                        <span th:text="${loginMethod ?: '소셜 로그인으로 접속'}">소셜 로그인으로 접속</span>
                    </p>
                    <p class="user-email"
                        th:text="${#authentication.principal.attributes['email'] ?: #authentication.name}">
                        user@example.com</p>
                </div>
            </div>

            <!-- Points Section -->
            <div class="points-section">
                <!-- 내 츄르 (포인트) -->
                <div class="point-card churu-card">
                    <div class="point-header">
                        <span class="point-icon">🐱</span>
                        <span class="point-label">내 츄르</span>
                    </div>
                    <div class="point-value">
                        <span class="point-amount" th:text="${userPoints ?: 0}">0</span>
                        <span class="point-unit">츄르</span>
                    </div>
                    <a href="/points/charge" class="point-btn charge-btn">
                        <span>💳</span> 츄르 충전하기
                    </a>
                </div>

                <!-- 내 냥 (보너스 포인트) -->
                <div class="point-card nyang-card">
                    <div class="point-header">
                        <span class="point-icon">✨</span>
                        <span class="point-label">내 냥</span>
                    </div>
                    <div class="point-value">
                        <span class="point-amount" th:text="${userNyang ?: 0}">0</span>
                        <span class="point-unit">냥</span>
                    </div>
                    <p class="point-hint">냥은 <a href="/events">오늘의 운세 보기</a>에서 사용할 수 있어요!</p>
                    <a href="/points/convert" class="point-btn convert-btn">
                        <span>🔄</span> 냥을 츄르로 바꾸기
                    </a>
                </div>
            </div>

            <!-- Menu List -->
            <div class="menu-list">
                <a href="/history" class="menu-item">
                    <span class="menu-icon">📋</span>
                    <span class="menu-text">사용내역</span>
                    <span class="menu-arrow">›</span>
                </a>
                <a href="/gift" class="menu-item">
                    <span class="menu-icon">🎁</span>
                    <span class="menu-text">선물하기</span>
                    <span class="menu-arrow">›</span>
                </a>
                <a href="/support" class="menu-item">
                    <span class="menu-icon">💬</span>
                    <span class="menu-text">문의하기</span>
                    <span class="menu-arrow">›</span>
                </a>

                <div class="menu-divider"></div>

                <a href="/logout" class="menu-item logout-item">
                    <span class="menu-icon">🚪</span>
                    <span class="menu-text">로그아웃</span>
                    <span class="menu-arrow">›</span>
                </a>
                <a href="/account/delete" class="menu-item delete-item">
                    <span class="menu-icon">✖</span>
                    <span class="menu-text">회원탈퇴</span>
                    <span class="menu-arrow">›</span>
                </a>
            </div>

            <!-- Footer Links -->
            <div class="mypage-footer">
                <a href="/about">회사소개</a>
                <span class="divider">·</span>
                <a href="/terms">이용약관</a>
                <span class="divider">·</span>
                <a href="/privacy">개인정보처리방침</a>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="/fortune/saju" class="nav-item">
            <span class="nav-icon">📅</span>
            <span class="nav-label">사주</span>
            <span class="nav-desc">운명이 궁금하다면</span>
        </a>
        <a href="/fortune/compatibility" class="nav-item">
            <span class="nav-icon">💕</span>
            <span class="nav-label">궁합</span>
            <span class="nav-desc">우리 궁합은 얼마?</span>
        </a>
        <a href="/fortune/today" class="nav-item active">
            <span class="nav-icon">✨</span>
            <span class="nav-label">운세</span>
            <span class="nav-desc">2026 신년운세</span>
        </a>
    </nav>

    <!-- JavaScript -->
    <script>
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        document.addEventListener('DOMContentLoaded', createStars);
    </script>
</body>

</html>
