<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <!-- bootstrap css --> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container col-12 col-lg-4">
        <div class="px-4 py-5 mt-5 text-center">
            <h1 class="display-5 fw-bold text-body-emphasis">회원 가입</h1>
        </div>

        <!-- 회원가입 영역 -->
        <main class="form-signin login-box w-100 m-auto">
            <!--
            novalidate 사용 이유:
            - 브라우저 기본 이메일 검증(@ 미입력 경고 등)을 비활성화
            - 서버에서 내려주는 검증 메시지만 사용하기 위함
            -->
            <form th:object="${joinRequest}" id="form" action="/join" method="post" class="needs-validation" onsubmit="return checkSubmit(event)" novalidate>
                <input type="hidden" name="usernameChecked" th:value="${joinRequest.usernameChecked}" />
                <input type="hidden" name="nicknameChecked" th:value="${joinRequest.nicknameChecked}" />
                <!-- CSRF TOKEN -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                
                <div class="input-group my-2">
                    <div class="form-floating" id="box-id">
                        <input type="text" class="form-control" id="username" th:field="*{username}" oninput="setChecked('username', false); clearInlineError('username')" placeholder="아이디" autofocus>
                        <label for="username">아이디(이메일)</label>
                    </div>
                    <div class="input-group-append">
                        <button type="button" class="btn btn-lg btn-outline-secondary h-100" onclick="checkDuplicate('username')" >중복확인</button>
                    </div>
                </div>  
                <div id="username-error" class="text-danger w-100" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                <div id="username-inline-error" class="text-danger w-100"></div>
                
                <div class="input-group my-2">
                    <div class="form-floating" id="box-id">
                        <input type="text" class="form-control" id="nickname" th:field="*{nickname}" oninput="setChecked('nickname', false); clearInlineError('nickname')" placeholder="닉네임" autofocus="">
                        <label for="nickname">닉네임</label>
                    </div>
                    <div class="input-group-append">
                        <button type="button" class="btn btn-lg btn-outline-secondary h-100" onclick="checkDuplicate('nickname')" >중복확인</button>
                    </div>                    
                </div>
                <div id="nickname-error" class="text-danger w-100" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></div>
                <div id="nickname-inline-error" class="text-danger w-100"></div>
                
                <div class="form-floating my-2">
                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="비밀번호">
                    <label for="password">비밀번호</label>
                </div>
                <div class="text-danger w-100" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                
                <div class="form-floating my-2">
                    <input type="password" class="form-control" id="passwordCheck" th:field="*{passwordCheck}" placeholder="비밀번호 확인">
                    <label for="passwordCheck">비밀번호 확인</label>
                </div>                
                <div class="text-danger w-100" th:if="${#fields.hasErrors('passwordCheck')}" th:errors="*{passwordCheck}"></div>
                
                <div class="form-floating my-2">
                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="이름" autofocus="">
                    <label for="name">이름</label>
                </div>
                <div class="text-danger w-100" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>            
                
                <div class="d-grid gap-2">
                    <button class="btn btn-lg btn-primary w-100 py-2" type="submit">회원가입</button>
                    <a href="/" class="btn btn-lg btn-success w-100 py-2">메인</a>
                </div>
            </form>
        </main>

    </div>

    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>


    <script>
        // 💍 CRSF TOKEN
        const csrfToken = "[[${_csrf.token}]]"        

        // hidden 필드 제어
        function setChecked(type, value) {
            document.querySelector(`[name="${type}Checked"]`).value = value;
        }
        function isChecked(type) {
            return document.querySelector(`[name="${type}Checked"]`).value === "true";
        }

        function setInlineError(type, message) {
            const errorEl = document.getElementById(`${type}-inline-error`);
            if (errorEl) {
                errorEl.textContent = message || "";
            }
        }

        function clearInlineError(type) {
            setInlineError(type, "");
        }

        // 중복검사
        async function checkDuplicate(type) {
            const input = document.getElementById(type);
            const value = input.value;

            const label = document.querySelector(`label[for="${type}"]`);
            const labelText = label ? label.innerText : "";

            try {
                const response = await fetch(`/check?type=${encodeURIComponent(type)}&value=${encodeURIComponent(value)}`, {
                    method: 'GET',
                    headers: {
                        'X-CSRF-TOKEN': csrfToken
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    setInlineError(type, data.message || `${labelText} 중복 확인 중 오류가 발생했습니다.`);
                    setChecked(type, false);
                    return false;
                }

                if (data.ok) {
                    setInlineError(type, data.message || `사용 가능한 ${labelText}입니다.`);
                    input.classList.add('was-validated');
                    input.classList.remove('needs-validation');

                    setChecked(type, true);   // 통과
                    return true;
                }

                setInlineError(type, data.message || `중복된 ${labelText}입니다.`);
                input.classList.add('needs-validation');
                input.classList.remove('was-validated');

                setChecked(type, false);  // 실패
                return false;

            } catch (error) {
                console.error('Error:', error);
                setInlineError(type, `${labelText} 중복 확인 중 오류가 발생했습니다.`);
                setChecked(type, false);
                return false;
            }           
        }

        // 제출 확인
        async function checkSubmit(event) {
            event.preventDefault(); // 폼 제출 방지

            // if (!isChecked("username")) {
            //     document.getElementById("username-error").innerText =
            //         "이메일 중복 확인을 해주세요";
            //     return;
            // }

            // if (!isChecked("nickname")) {
            //     document.getElementById("nickname-error").innerText =
            //         "닉네임 중복 확인을 해주세요";
            //     return;
            // }

            if (!isChecked("username")) {
                setInlineError("username", "아이디 중복 확인을 해주세요");
                return false;
            }

            if (!isChecked("nickname")) {
                setInlineError("nickname", "닉네임 중복 확인을 해주세요");
                return false;
            }
            document.getElementById("form").submit();
        }
    </script>
</body>
</html>
