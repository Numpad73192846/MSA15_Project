spring.application.name=board

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/aloha?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=aloha
spring.datasource.password=123456

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.aloha.board.domain
mybatis.mapper-locations=classpath:mybatis/mapper/**/*.xml

logging.level.root=DEBUG
logging.level.com.aloha.board=DEBUG