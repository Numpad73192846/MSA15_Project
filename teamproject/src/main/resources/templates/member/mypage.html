<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main_layout}">

    <div layout:fragment="content">
        <div class="container py-5">
            <!-- Header -->
            <div class="mb-4">
                <h2 class="h3 fw-bold mb-1">
                    <img src="/img/mypage/book.svg" alt="마이페이지" style="width: 32px; height: 32px; margin-right: 8px; vertical-align: middle;">
                    마이페이지
                </h2>
                <p class="text-muted mb-0">프로필과 학습 내역을 관리하세요</p>
            </div>

            <div class="row g-4">
                <!-- Left Column: Profile -->
                <div class="col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-body text-center">
                            <div class="profile-avatar mb-3">
                                <div
                                    class="avatar-circle bg-info text-white d-flex align-items-center justify-content-center mx-auto"
                                    style="cursor: pointer;"
                                    onclick="document.getElementById('editProfileImage').click(); document.getElementById('profileEditModal').querySelector('[data-bs-dismiss]').click(); setTimeout(() => { var modal = new bootstrap.Modal(document.getElementById('profileEditModal')); modal.show(); }, 100);">
                                    <span class="fs-1">👤</span>
                                </div>
                            </div>
                            <h3 class="h5 fw-bold mb-1" id="memberName" th:text="${user.name}">홍길동</h3>
                            <p class="text-muted small mb-3" id="memberEmail" th:text="${user.username}">
                                hong@example.com</p>

                            <div class="mb-3">
                                <span class="badge bg-light text-dark">회원</span>
                            </div>

                            <button class="btn btn-outline-primary w-100 mb-2" id="btnEditMemberProfile"
                                data-bs-toggle="modal" data-bs-target="#profileEditModal">
                                프로필 수정
                            </button>
                            <button class="btn btn-primary w-100" onclick="location.href='/tutors'">
                                튜터 찾기
                            </button>
                        </div>
                    </div>

                    <!-- My Class Card -->
                    <div class="card shadow-sm mt-3 border-primary" id="myClassCard" style="display: none;">
                        <div class="card-header">
                            <h3 class="h6 fw-bold mb-0">내 수업</h3>
                        </div>
                        <div class="card-body" id="myClassContent">
                            <div class="text-center text-muted py-2">예정된 수업이 없습니다.</div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Activity -->
                <div class="col-lg-8">
                    <!-- Quick Stats -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <div class="stat-card card shadow-sm h-100">
                                <div class="card-body text-center">
                                    <div class="stat-icon mb-2">
                                        <img src="/img/mypage/remain.svg" alt="예정된 수업" style="width: 76px; height: 76px;">
                                    </div>
                                    <div class="stat-value fw-bold text-primary">3</div>
                                    <div class="stat-label small text-muted">예정된 수업</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="stat-card card shadow-sm h-100">
                                <div class="card-body text-center">
                                    <div class="stat-icon mb-2">
                                        <img src="/img/mypage/done.svg" alt="완료한 수업" style="width: 76px; height: 76px;">
                                    </div>
                                    <div class="stat-value fw-bold text-success">24</div>
                                    <div class="stat-label small text-muted">완료한 수업</div>
                                </div>
                            </div>
                        </div>
                    </div>



                    <!-- Tutor Messages Card -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                            <h3 class="h6 fw-bold mb-0">튜터 메시지</h3>
                        </div>
                        <div class="list-group list-group-flush pt-2" id="tutorMessagesContainer">
                            <div class="text-center text-muted py-3">메시지가 없습니다.</div>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <ul class="nav nav-tabs mb-3" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#bookingsTab"
                                type="button">
                                예약 내역
                            </button>
                        </li>

                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#reviewsTab" type="button">
                                내 리뷰
                            </button>
                        </li>
                    </ul>

                    <!-- Tab Content -->
                    <div class="tab-content">
                        <!-- Bookings Tab -->
                        <div class="tab-pane fade show active" id="bookingsTab">
                            <div class="card shadow-sm mb-3">
                                <div class="card-body">
                                    <h4 class="h6 fw-bold mb-3">예정된 수업</h4>
                                    <div class="d-grid gap-2" id="upcomingBookingsContainer">
                                        <div class="text-center text-muted py-3">예정된 수업이 없습니다.</div>
                                    </div>
                                </div>
                            </div>

                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h4 class="h6 fw-bold mb-3">지난 수업</h4>
                                    <div class="d-grid gap-2" id="pastBookingsContainer">
                                        <div class="text-center text-muted py-3">지난 수업이 없습니다.</div>
                                    </div>
                                </div>
                            </div>
                        </div>



                        <!-- Reviews Tab -->
                        <div class="tab-pane fade" id="reviewsTab">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h4 class="h6 fw-bold mb-3">내가 작성한 리뷰</h4>
                                    <div class="d-grid gap-3" id="reviewsContainer">
                                        <div class="text-center text-muted py-3">작성한 리뷰가 없습니다.</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Message Detail & Reply Modal -->
        <div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg">
                    <div class="modal-header border-bottom-0 pb-0">
                        <h5 class="modal-title fw-bold">메시지 확인</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="d-flex align-items-center mb-4">
                            <div class="avatar-circle bg-light text-primary d-flex align-items-center justify-content-center me-3"
                                style="width: 48px; height: 48px; font-size: 20px;">
                                <span id="msgTutorInitial">T</span>
                            </div>
                            <div>
                                <h6 class="fw-bold mb-0" id="msgTutorName">튜터 이름</h6>
                                <small class="text-muted" id="msgDate">시간</small>
                            </div>
                        </div>
                        <div class="p-3 bg-light rounded-3 mb-4">
                            <p class="mb-0 text-dark small" id="msgContent">메시지 내용...</p>
                        </div>

                        <hr class="border-light my-4">

                        <h6 class="fw-bold small mb-3">답장 보내기</h6>
                        <div class="mb-3">
                            <textarea class="form-control bg-light border-0" id="replyMessageArea" rows="4"
                                placeholder="답장을 입력하세요..." style="resize: none;"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pt-0">
                        <button type="button" class="btn btn-light text-muted" data-bs-dismiss="modal">닫기</button>
                        <button type="button" class="btn btn-primary px-4" onclick="alert('답장이 전송되었습니다.');"
                            data-bs-dismiss="modal">
                            <span class="me-1">📤</span> 전송하기
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // 수업 취소 함수
            async function cancelBooking(bookingId) {
                if (!confirm('수업을 취소하시겠습니까?')) return;
                
                try {
                    const response = await fetch(`/api/bookings/${bookingId}/cancel`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const result = await response.json();
                    if (result.success) {
                        alert('수업이 취소되었습니다.');
                        location.reload();
                    } else {
                        alert(result.message || '취소에 실패했습니다.');
                    }
                } catch (e) {
                    console.error('취소 실패', e);
                    alert('취소 처리 중 오류가 발생했습니다.');
                }
            }
            
            // 페이지 로드 시 회원 마이페이지 데이터 초기화
            document.addEventListener('DOMContentLoaded', async function() {
                try {
                    const response = await fetch('/api/users/me/mypage');
                    if (!response.ok) throw new Error('Failed to fetch');
                    
                    const result = await response.json();
                    if (result.success && result.data) {
                        const mypage = result.data;
                        
                        // 프로필 정보 바인딩
                        document.getElementById('memberName').textContent = mypage.name || '회원';
                        document.getElementById('memberEmail').textContent = mypage.email || '';
                        
                        // 모달 폼에도 바인딩
                        document.getElementById('editName').value = mypage.name || '';
                        document.getElementById('editNickname').value = mypage.nickname || '';
                        document.getElementById('editEmail').value = mypage.email || '';
                        
                        // Stats 바인딩
                        if (mypage.memberStats) {
                            const stats = mypage.memberStats;
                            const statValues = document.querySelectorAll('.stat-value');
                            statValues[0].textContent = stats.upcomingLessons || 0;
                            statValues[1].textContent = stats.completedLessons || 0;
                        }
                        
                        // 예정된 수업 바인딩
                        if (mypage.upcomingBookings && mypage.upcomingBookings.length > 0) {
                            const upcomingContainer = document.querySelector('#bookingsTab .card:first-child .d-grid');
                            if (upcomingContainer) {
                                upcomingContainer.innerHTML = '';
                                mypage.upcomingBookings.forEach(booking => {
                                    const item = document.createElement('div');
                                    item.className = 'booking-item p-3 border rounded';
                                    const statusBadge = booking.status === 'CONFIRMED' ? 'bg-success' : 'bg-warning text-dark';
                                    const statusText = booking.status === 'CONFIRMED' ? '확정' : 
                                                      booking.status === 'PENDING' ? '대기중' : '취소됨';
                                    const cancelBtn = booking.status === 'PENDING' 
                                        ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelBooking('${booking.bookingId}')">취소</button>` 
                                        : '';
                                    item.innerHTML = `
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <div>
                                                <div class="fw-semibold">${booking.tutorName} 튜터</div>
                                                <div class="small text-muted mt-1">
                                                    📅 ${booking.lessonDate} | ⏰ ${booking.startTime} (${booking.durationHours}시간)
                                                </div>
                                            </div>
                                            <span class="badge ${statusBadge}">${statusText}</span>
                                        </div>
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span class="badge bg-light text-dark">${booking.subject}</span>
                                            <div class="d-flex gap-2">
                                                <span class="fw-semibold text-primary">${new Intl.NumberFormat('ko-KR').format(booking.price)}원</span>
                                                ${cancelBtn}
                                            </div>
                                        </div>
                                    `;
                                    upcomingContainer.appendChild(item);
                                });
                            }
                        }
                        
                        // 지난 수업 바인딩
                        if (mypage.pastBookings && mypage.pastBookings.length > 0) {
                            const pastContainer = document.querySelector('#bookingsTab .card:nth-child(2) .d-grid');
                            if (pastContainer) {
                                pastContainer.innerHTML = '';
                                mypage.pastBookings.forEach(booking => {
                                    const item = document.createElement('div');
                                    item.className = 'booking-item p-3 border rounded opacity-75';
                                    item.innerHTML = `
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <div>
                                                <div class="fw-semibold">${booking.tutorName} 튜터</div>
                                                <div class="small text-muted mt-1">
                                                    📅 ${booking.lessonDate} | ⏰ ${booking.startTime} (${booking.durationHours}시간)
                                                </div>
                                            </div>
                                            <span class="badge bg-secondary">완료</span>
                                        </div>
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span class="badge bg-light text-dark">${booking.subject}</span>
                                            <button class="btn btn-sm btn-outline-primary" onclick="location.href='/tutors/' + '${booking.tutorId}'">리뷰 작성</button>
                                        </div>
                                    `;
                                    pastContainer.appendChild(item);
                                });
                            }
                        }
                        
                        // 리뷰 바인딩
                        if (mypage.studentReviews && mypage.studentReviews.length > 0) {
                            const reviewContainer = document.querySelector('#reviewsTab .d-grid');
                            if (reviewContainer) {
                                reviewContainer.innerHTML = '';
                                mypage.studentReviews.forEach(review => {
                                    const rating = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating);
                                    const createdDate = new Date(review.createdAt).toLocaleDateString('ko-KR');
                                    const item = document.createElement('div');
                                    item.className = 'review-item p-3 bg-light rounded';
                                    item.style.cursor = 'pointer';
                                    item.onclick = () => location.href = `/tutors/${review.tutorId}`;
                                    item.innerHTML = `
                                        <div class="d-flex justify-content-between mb-2">
                                            <div class="fw-semibold">${review.tutorName} 튜터 <small class="text-primary opacity-75 ms-1">상세보기 ↗</small></div>
                                            <div class="text-warning">${rating}</div>
                                        </div>
                                        <p class="small mb-1">${review.content}</p>
                                        <div class="small text-muted">${createdDate}</div>
                                    `;
                                    reviewContainer.appendChild(item);
                                });
                            }
                        }
                    }
                } catch (e) {
                    console.warn('마이페이지 데이터 로드 실패', e);
                }
            });
            
            // Simple script to populate modal based on clicked item
            document.addEventListener('DOMContentLoaded', function () {
                var messageModal = document.getElementById('messageModal');
                messageModal.addEventListener('show.bs.modal', function (event) {
                    var button = event.relatedTarget;
                    var tutor = button.getAttribute('data-tutor');
                    var date = button.getAttribute('data-date');
                    var message = button.getAttribute('data-message');

                    document.getElementById('msgTutorName').textContent = tutor;
                    document.getElementById('msgDate').textContent = date;
                    document.getElementById('msgContent').textContent = message;

                    // Initial extraction for avatar
                    var initial = tutor.trim().charAt(0);
                    document.getElementById('msgTutorInitial').textContent = initial;

                    // Clear reply area
                    document.getElementById('replyMessageArea').value = '';
                })
            });
        </script>
        <!-- Profile Edit Modal -->
        <div class="modal fade" id="profileEditModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form action="/member/mypage/update" method="POST" enctype="multipart/form-data">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold">프로필 수정</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="editName" class="form-label">이름</label>
                                <input type="text" class="form-control" id="editName" name="name"
                                    th:value="${user.name}">
                            </div>
                            <div class="mb-3">
                                <label for="editNickname" class="form-label">닉네임</label>
                                <input type="text" class="form-control" id="editNickname" name="nickname"
                                    th:value="${user.nickname}">
                            </div>
                            <div class="mb-3">
                                <label for="editEmail" class="form-label">이메일(ID)</label>
                                <input type="email" class="form-control" id="editEmail" name="username"
                                    th:value="${user.username}" readonly>
                            </div>
                            <div class="mb-3">
                                <label for="editProfileImage" class="form-label">프로필 이미지</label>
                                <input type="file" class="form-control" id="editProfileImage" name="profileImage"
                                    accept="image/*">
                                <div class="mt-2 text-center" id="imagePreviewContainer" style="display: none;">
                                    <img id="imagePreview" src="" alt="Profile Preview" class="rounded-circle shadow-sm"
                                        style="width: 100px; height: 100px; object-fit: cover;">
                                </div>
                            </div>
                            <script>
                                document.getElementById('editProfileImage').addEventListener('change', function (e) {
                                    if (e.target.files && e.target.files[0]) {
                                        var reader = new FileReader();
                                        reader.onload = function (e) {
                                            document.getElementById('imagePreview').src = e.target.result;
                                            document.getElementById('imagePreviewContainer').style.display = 'block';
                                        }
                                        reader.readAsDataURL(e.target.files[0]);
                                    }
                                });
                            </script>
                            <!-- Password change could be added here -->
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                            <button type="submit" class="btn btn-primary">저장</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
