<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main_layout}">

    <div layout:fragment="content">
        <div class="container py-5" style="max-width: 720px;">
            <div class="mb-4 text-center">
                <h2 class="h4 fw-bold">튜터 회원가입 (4/4단계)</h2>
                <p class="text-muted mb-0">수업 가능 시간대를 입력해 주세요.</p>
            </div>

            <div class="progress mb-4" style="height: 8px;">
                <div class="progress-bar" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form id="tutorProfileForm">
                        <div class="mb-4">
                            <h5 class="fw-bold">수업 가능 시간대</h5>
                            <textarea class="form-control" id="availableTime" rows="6" 
                                placeholder="수업 가능 시간대를 자세히 입력해주세요.&#10;&#10;예시)&#10;평일: 19:00 ~ 22:00&#10;주말: 09:00 ~ 18:00&#10;&#10;협의 가능한 시간대도 함께 작성해주세요." 
                                required></textarea>
                            <small class="text-muted">학생들이 수업을 예약할 수 있는 시간대를 명확히 입력해주세요.</small>
                        </div>
                        
                        <div class="alert alert-info">
                            <strong>팁:</strong> 가능한 시간대를 구체적으로 작성하면 학생들의 예약률이 높아집니다!
                        </div>

                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-secondary" style="height: 45px; line-height: 1; display: flex; align-items: center; justify-content: center;" onclick="history.back()">이전</button>
                            <button type="submit" class="btn btn-success flex-fill" style="height: 45px; line-height: 1; display: flex; align-items: center; justify-content: center;">
                                <i class="bi bi-check-circle"></i> 회원가입 완료
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script>
            function getStoredTokens() {
                return {
                    accessToken: localStorage.getItem('accessToken'),
                    refreshToken: localStorage.getItem('refreshToken')
                };
            }

            async function fetchMe(accessToken) {
                const response = await fetch('/api/users/me', {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });
                if (!response.ok) {
                    return null;
                }
                const data = await response.json();
                if (!data || data.success === false) {
                    return null;
                }
                return data.data || null;
            }

            function isTutor(authList) {
                if (!Array.isArray(authList)) {
                    return false;
                }
                return authList.some((a) =>
                    a.auth === 'ROLE_TUTOR' ||
                    a.auth === 'ROLE_TUTOR_PENDING' ||
                    a === 'ROLE_TUTOR' ||
                    a === 'ROLE_TUTOR_PENDING'
                );
            }

            document.addEventListener('DOMContentLoaded', async () => {
                // ====== 수정: 권한 체크 완전 제거 (회원가입 진행) ======
                // 이전에 저장된 데이터 불러오기
                const savedData = JSON.parse(sessionStorage.getItem('tutorRegisterStep4') || '{}');
                if (savedData.availableTime) {
                    document.getElementById('availableTime').value = savedData.availableTime;
                }
                // ====== 수정 종료 ======
            });

            document.getElementById('tutorProfileForm').addEventListener('submit', async (event) => {
                event.preventDefault();

                const { accessToken } = getStoredTokens();
                if (!accessToken) {
                    location.href = '/login';
                    return;
                }

                // 4단계 데이터 저장
                const step4Data = {
                    availableTime: document.getElementById('availableTime').value
                };
                sessionStorage.setItem('tutorRegisterStep4', JSON.stringify(step4Data));

                // 모든 단계의 데이터 수집
                const step1Data = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                const step2Data = JSON.parse(sessionStorage.getItem('tutorRegisterStep2') || '{}');
                const step3Data = JSON.parse(sessionStorage.getItem('tutorRegisterStep3') || '{}');

                // 최종 제출 데이터
                const payload = {
                    // Step 1
                    basicName: step1Data.basicName,
                    basicPhone: step1Data.basicPhone,
                    headline: step1Data.headline,
                    bio: step1Data.bio,
                    videoUrl: step1Data.videoUrl,
                    
                    // Step 2
                    career: step2Data.career,
                    selfIntro: step2Data.selfIntro,
                    
                    // Step 3
                    lessonSubjects: step3Data.lessonSubjects,
                    fieldIds: step3Data.fieldIds || [],
                    
                    // Step 4
                    availableTime: step4Data.availableTime
                };

                try {
                    const response = await fetch('/api/tutors/profile', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: `Bearer ${accessToken}`
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();
                    
                    if (!data.success) {
                        alert(data.message || '튜터 정보를 저장하지 못했습니다.');
                        return;
                    }

                    // 성공 시 세션 스토리지 클리어
                    sessionStorage.removeItem('tutorRegisterStep1');
                    sessionStorage.removeItem('tutorRegisterStep2');
                    sessionStorage.removeItem('tutorRegisterStep3');
                    sessionStorage.removeItem('tutorRegisterStep4');

                    alert('튜터 회원가입이 완료되었습니다!');
                    location.href = '/tutor/mypage';
                } catch (error) {
                    console.error('Error:', error);
                    alert('서버와 통신 중 오류가 발생했습니다.');
                }
            });
        </script>
    </div>
</div>
