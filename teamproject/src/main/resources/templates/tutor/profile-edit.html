    layout:decorate="~{layouts/main_layout}">

    <th:block layout:fragment="extra-css">
    <link rel="stylesheet" href="/css/tutor-register-admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>

        .edit-shell { display: flex; gap: 24px; }

    <div layout:fragment="content">
        <div class="container py-4">
            <!-- 헤더 -->

                <div>
                    <h2 class="fw-bold mb-1">프로필 수정</h2>

                </div>
                <div class="d-flex gap-2">
                    <a href="/tutor/mypage" class="btn btn-outline-secondary btn-sm btn-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> 마이페이지로
                    </a>
                </div>
            </div>

            <div class="edit-shell">
                <!-- 사이드바 -->
                <aside class="edit-sidebar">
                    <div class="card edit-card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <div id="sidebarProfileImg" class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width:60px;height:60px;font-size:1.5rem;">
                                    👨‍🏫
                                </div>
                                <div>
                                    <div class="fw-bold" id="sidebarName">튜터</div>
                                    <div class="muted small" id="sidebarLoginId">아이디</div>
                                </div>

                            <div class="divider"></div>

                            <div class="list-group edit-menu">
                                <a class="list-group-item active" data-section="basic">
                                    <i class="bi bi-person me-2"></i> 기본 정보
                                </a>
                                <a class="list-group-item" data-section="profile">
                                    <i class="bi bi-card-text me-2"></i> 프로필
                                </a>
                                <a class="list-group-item" data-section="account">
                                    <i class="bi bi-bank me-2"></i> 계좌 정보
                                </a>
                                <a class="list-group-item" data-section="documents">
                                    <i class="bi bi-file-earmark-arrow-up me-2"></i> 서류 업로드
                                </a>

                                    <i class="bi bi-book me-2"></i> 수업관리
                                </a>
                                <a class="list-group-item" data-section="schedule">
                                   <i class="bi bi-calendar2-check me-2"></i> 스케줄 관리
                                </a>
                                <a class="list-group-item" data-section="security">
                                    <i class="bi bi-shield-lock me-2"></i> 보안

                            </div>
                        </div>
                    </div>
                </aside>

                <!-- 메인 컨텐츠 -->
                <main class="flex-grow-1">
                    <form id="profileEditForm">
                        <div id="profileEditContainer"></div>

                        <!-- 저장 버튼 -->
                        <!-- <div class="d-flex justify-content-end gap-2">
                            <a href="/tutor/mypage" class="btn btn-outline-secondary px-4">취소</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg me-1"></i> 저장
                            </button>
                        </div> -->
                    </form>
                </main>
            </div>
        </div>

        <script>
            const getFallbackToken = () => localStorage.getItem('accessToken');
            const getAuthHeaders = () => {
                if (typeof buildAuthHeaders === 'function') {
                    return buildAuthHeaders();
                }
                const token = getFallbackToken();
                return token ? { 'Authorization': `Bearer ${token}` } : {};
            };

            async function ensureAuth() {
                const token = (typeof getAccessToken === 'function') ? getAccessToken() : getFallbackToken();
                if (token) return true;
                if (typeof refreshAccessToken === 'function') {
                    return await refreshAccessToken();
                }
                return false;
            }

            async function fetchWithAuth(url, options = {}) {
                const headers = { ...(options.headers || {}), ...getAuthHeaders() };
                const response = await fetch(url, {
                    ...options,
                    headers,
                    credentials: 'include'
                });

                if (response.status === 401 && typeof refreshAccessToken === 'function') {
                    const refreshed = await refreshAccessToken();
                    if (refreshed) {
                        const retryHeaders = { ...(options.headers || {}), ...getAuthHeaders() };
                        return fetch(url, {
                            ...options,
                            headers: retryHeaders,
                            credentials: 'include'
                        });
                    }
                }

                return response;
            }

            const sections = ["basic","profile","account","documents","lessons","schedule","security"];
            const profileState = {
                loginId: "",
                email: "",
                nickname: "",
                name: "",
                phone: "",
                headline: "",
                bio: "",
                selfIntro: "",
                videoUrl: "",
                bankName: "",
                accountNumber: "",
                accountHolder: "",
                password: "",
                passwordConfirm: "",
                profileImgFile: null,
                profileImgUrl: ""
            };

            function collectSectionValues(){
                if (document.getElementById('editEmail')) profileState.email = document.getElementById('editEmail').value || "";
                if (document.getElementById('editNickname')) profileState.nickname = document.getElementById('editNickname').value || "";
                if (document.getElementById('editName')) profileState.name = document.getElementById('editName').value || "";
                if (document.getElementById('editPhone')) profileState.phone = document.getElementById('editPhone').value || "";
                if (document.getElementById('editHeadline')) profileState.headline = document.getElementById('editHeadline').value || "";
                if (document.getElementById('editBio')) profileState.bio = document.getElementById('editBio').value || "";
                if (document.getElementById('editSelfIntro')) profileState.selfIntro = document.getElementById('editSelfIntro').value || "";
                if (document.getElementById('editVideoUrl')) profileState.videoUrl = document.getElementById('editVideoUrl').value || "";
                if (document.getElementById('editBankName')) profileState.bankName = document.getElementById('editBankName').value || "";
                if (document.getElementById('editAccountNumber')) profileState.accountNumber = document.getElementById('editAccountNumber').value || "";
                if (document.getElementById('editAccountHolder')) profileState.accountHolder = document.getElementById('editAccountHolder').value || "";
                if (document.getElementById('editPassword')) profileState.password = document.getElementById('editPassword').value || "";
                if (document.getElementById('editPasswordConfirm')) profileState.passwordConfirm = document.getElementById('editPasswordConfirm').value || "";

                const profileImgInput = document.getElementById('editProfileImg');
                if (profileImgInput && profileImgInput.files[0]) {
                    profileState.profileImgFile = profileImgInput.files[0];
                }
            }

            function applyStateToSection(){
                const elements = {
                    editEmail: document.getElementById('editEmail'),
                    editNickname: document.getElementById('editNickname'),
                    editName: document.getElementById('editName'),
                    editPhone: document.getElementById('editPhone'),
                    editHeadline: document.getElementById('editHeadline'),
                    editBio: document.getElementById('editBio'),
                    editSelfIntro: document.getElementById('editSelfIntro'),
                    editVideoUrl: document.getElementById('editVideoUrl'),
                    editBankName: document.getElementById('editBankName'),
                    editAccountNumber: document.getElementById('editAccountNumber'),
                    editAccountHolder: document.getElementById('editAccountHolder'),
                    currentProfileImg: document.getElementById('currentProfileImg')
                };

                // 안전하게 값 설정
                if (elements.editEmail) elements.editEmail.value = profileState.email || "";
                if (elements.editNickname) elements.editNickname.value = profileState.nickname || "";
                if (elements.editName) elements.editName.value = profileState.name || "";
                if (elements.editPhone) elements.editPhone.value = profileState.phone || "";
                if (elements.editHeadline) elements.editHeadline.value = profileState.headline || "";
                if (elements.editBio) elements.editBio.value = profileState.bio || "";
                if (elements.editSelfIntro) elements.editSelfIntro.value = profileState.selfIntro || "";
                if (elements.editVideoUrl) elements.editVideoUrl.value = profileState.videoUrl || "";
                if (elements.editBankName) {
                    elements.editBankName.value = profileState.bankName || "";
                    // select option selected 처리 (동적 렌더링 대응)
                    Array.from(elements.editBankName.options).forEach(opt => {
                        opt.selected = (opt.value === profileState.bankName);
                    });
                }
                if (elements.editAccountNumber) elements.editAccountNumber.value = profileState.accountNumber || "";
                if (elements.editAccountHolder) elements.editAccountHolder.value = profileState.accountHolder || "";
                
                // 프로필 이미지 처리
                if (elements.currentProfileImg && profileState.profileImgUrl) {
                    elements.currentProfileImg.classList.remove('bg-primary');
                    elements.currentProfileImg.innerHTML =
                        `<img src="${profileState.profileImgUrl}" class="rounded-circle w-100 h-100 object-fit-cover" alt="프로필">`;
                } else if (elements.currentProfileImg) {
                    elements.currentProfileImg.classList.add('bg-primary');
                    elements.currentProfileImg.innerHTML = `
                        <span class="fs-1">👨‍🏫</span>
                    `;
                }                
            }

            console.log('profileState 초기값:', profileState);

            // 프로필 이미지 변경 미리보기
            function bindProfileImagePreview() {
                const profileImgInput = document.getElementById('editProfileImg');
                const currentProfileImg = document.getElementById('currentProfileImg');                
                
                if (!profileImgInput || !currentProfileImg) return;               

                profileImgInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    // 상태 저장 (submit 때 사용)
                    profileState.profileImgFile = file;

                    // 미리보기 URL 생성
                    const previewUrl = URL.createObjectURL(file);

                    // 🔥 currentProfileImg 안에 img가 있는지 확인
                    const imgEl = currentProfileImg.querySelector('img');

                    if (imgEl) {
                        // ✅ 이미 이미지가 있으면 src만 교체
                        imgEl.src = previewUrl;
                    } else {
                        // ✅ 이미지가 없으면 (이모지 상태)
                        currentProfileImg.classList.remove('bg-primary');
                        currentProfileImg.innerHTML = `
                            <img
                                src="${previewUrl}"
                                class="rounded-circle w-100 h-100 object-fit-cover"
                                alt="프로필 이미지 미리보기"
                            >
                        `;
                    }
                });
            }

            let currentSection = "basic";
            let securityVerified = false;

            async function verifySecurityAccessInline(){
                if (!profileState.loginId) {
                    alert('아이디 정보를 불러오지 못했습니다.');
                    return false;
                }

                const currentPassword = document.getElementById('securityPassword')?.value || "";
                if (!currentPassword) {
                    document.getElementById('securityError')?.classList.remove('d-none');
                    document.getElementById('securityError').textContent = '현재 비밀번호를 입력하세요.';
                    return false;
                }

                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: profileState.loginId, password: currentPassword }),
                    credentials: 'include'
                });
                const result = await response.json();
                if (!result || result.success === false) {
                    document.getElementById('securityError')?.classList.remove('d-none');
                    document.getElementById('securityError').textContent = '비밀번호가 올바르지 않습니다.';
                    return false;
                }

                securityVerified = true;
                const pwdInput = document.getElementById('securityPassword');
                const verifyBtn = document.getElementById('btnSecurityVerify');
                if (pwdInput) pwdInput.disabled = true;
                if (verifyBtn) {
                    verifyBtn.disabled = true;
                    verifyBtn.textContent = '확인 완료';
                }
                document.getElementById('securityGate')?.classList.add('d-none');
                document.getElementById('securityForm')?.classList.remove('d-none');
                return true;
            }

            async function runEmbeddedScripts(root) {
                const scripts = Array.from(root.querySelectorAll('script'));
                for (const old of scripts) {
                if (old.src) {
                    if (document.querySelector(`script[src="${old.src}"]`)) continue;
                    await new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = old.src;
                    s.async = false;
                    s.onload = resolve;
                    s.onerror = reject;
                    document.body.appendChild(s);
                    });
                } else {
                    const s = document.createElement('script');
                    s.textContent = old.textContent;
                    document.body.appendChild(s);
                }
                }
            }            

            async function showSection(key){
                const safeKey = sections.includes(key) ? key : "basic";
                collectSectionValues();

                document.querySelectorAll('.edit-menu .list-group-item').forEach(i => {
                    i.classList.toggle('active', i.dataset.section === safeKey);
                });

                const container = document.getElementById('profileEditContainer');
                if (!container) return;                

                try {
                    console.log(`[showSection] 요청 URL: /tutor/profile-edit/partial/${safeKey}`);
                    const res = await fetch(`/tutor/profile-edit/partial/${safeKey}`);
                    console.log(`[showSection] 응답 상태: ${res.status} ${res.statusText}`);
                    
                    if (!res.ok) {
                        const errorText = await res.text();
                        console.error(`[showSection] 응답 내용: ${errorText}`);
                        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                    }
                    
                    const html = await res.text();
                    console.log(`[showSection] HTML 로드 성공 (${html.length} chars)`);
                    container.innerHTML = html;
                    await runEmbeddedScripts(container);
                    applyStateToSection();
                    bindSectionHandlers(safeKey);
                    currentSection = safeKey;
                } catch (e) {
                    console.error('[showSection] 에러 발생:', e);
                    container.innerHTML = `
                      <div class="card edit-card shadow-sm">
                        <div class="card-body">
                          <div class="panel-title mb-1">불러오기 실패</div>
                          <div class="muted small">잠시 후 다시 시도해주세요.</div>
                          <div class="text-danger small mt-2">에러: ${e.message}</div>
                        </div>
                      </div>
                    `;


                }
            }

            function bindSectionHandlers(key){
                if (key === "basic") {
                    bindProfileImagePreview();
                }
                if (key === "documents") {
                    initDocumentSection();
                }
                if (key === "security") {
                    initSecuritySection();
                }
            }

            function initSecuritySection(){
                const gate = document.getElementById('securityGate');
                const form = document.getElementById('securityForm');
                if (!gate || !form) return;

                if (securityVerified) {
                    gate.classList.add('d-none');
                    form.classList.remove('d-none');
                } else {
                    gate.classList.remove('d-none');
                    form.classList.add('d-none');
                }

                document.getElementById('btnSecurityVerify')?.addEventListener('click', async () => {
                    await verifySecurityAccessInline();
                });

                document.getElementById('securityPassword')?.addEventListener('keydown', async (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        await verifySecurityAccessInline();
                    }
                });
            }

            // 섹션 전환
            document.querySelectorAll('.edit-menu .list-group-item').forEach(item => {
                item.addEventListener('click', function() {
                    showSection(this.dataset.section);
                });
            });

            // 페이지 로드 시 데이터 바인딩
            document.addEventListener('DOMContentLoaded', async function() {                

                try {
                    const authed = await ensureAuth();
                    if (!authed) {
                        location.href = '/login';
                        return;
                    }

                    const response = await fetchWithAuth('/api/tutors/me');
                    if (!response.ok) throw new Error('Failed to fetch');

                    const result = await response.json();
                    if (result.success && result.data) {
                        const profile = result.data.tutorProfile;
                        if (profile) {
                            // 사이드바
                            document.getElementById('sidebarName').textContent = profile.name || '튜터';
                            document.getElementById('sidebarLoginId').textContent = profile.email || '';
                            if (profile.profileImg) {
                                document.getElementById('sidebarProfileImg').classList.remove('bg-primary');
                                document.getElementById('sidebarProfileImg').innerHTML = 
                                    `<img src="${profile.profileImg}" class="rounded-circle w-100 h-100 object-fit-cover" alt="프로필">`;
                                profileState.profileImgUrl = profile.profileImg;
                            }else {
                                document.getElementById('sidebarProfileImg').classList.add('bg-primary');
                                document.getElementById('sidebarProfileImg').innerHTML = `
                                    <span class="fs-1">👨‍🏫</span>
                                `;
                            }

                            // 상태 저장
                            profileState.loginId = profile.email || '';
                            profileState.email = profile.email || '';
                            profileState.nickname = profile.nickname || '';
                            profileState.name = profile.name || '';
                            profileState.phone = profile.phone || '';
                            profileState.headline = profile.headline || '';
                            profileState.bio = profile.bio || '';
                            profileState.selfIntro = profile.selfIntro || '';
                            profileState.videoUrl = profile.videoUrl || '';
                            profileState.bankName = profile.bankName || '';
                            profileState.accountNumber = profile.accountNumber || '';
                            profileState.accountHolder = profile.accountHolder || '';

                            applyStateToSection();
                        }
                    }
                } catch (e) {
                    console.warn('프로필 데이터 로드 실패', e);
                }
            });

            // 섹션별 저장 함수
            async function saveSection(sectionType) {
                collectSectionValues();
                
                const formData = new FormData();
                
                // 섹션별로 필요한 데이터만 추가
                switch(sectionType) {
                    case 'basic':
                        formData.set('name', profileState.name || '');
                        formData.set('phone', profileState.phone || '');
                        if (profileState.profileImgFile) {
                            formData.set('profileImg', profileState.profileImgFile);
                        }
                        break;
                        
                    case 'profile':
                        formData.set('headline', profileState.headline || '');
                        formData.set('bio', profileState.bio || '');
                        formData.set('selfIntro', profileState.selfIntro || '');
                        formData.set('videoUrl', profileState.videoUrl || '');
                        break;                        
                    
                    case 'account':
                        formData.set('bankName', profileState.bankName || '');
                        formData.set('accountNumber', profileState.accountNumber || '');
                        formData.set('accountHolder', profileState.accountHolder || '');
                        break;

                    case 'documents':
                        // 파일 업로드: 학력증명서, 학위증명서, 자격증
                        const eduFiles = document.getElementById('editDocEducation')?.files || [];
                        const degFiles = document.getElementById('editDocDegree')?.files || [];
                        const certFiles = document.getElementById('editDocCertificate')?.files || [];
                        for (const file of eduFiles) {
                            formData.append('docEducation', file);
                        }
                        for (const file of degFiles) {
                            formData.append('docDegree', file);
                        }
                        for (const file of certFiles) {
                            formData.append('docCertificate', file);
                        }
                        break;
                        
                    case 'security':
                        if (profileState.password) {
                            if (profileState.password !== profileState.passwordConfirm) {
                                alert('비밀번호가 일치하지 않습니다.');
                                return;
                            }
                            formData.set('password', profileState.password);
                            formData.set('passwordConfirm', profileState.passwordConfirm);
                        }
                        break;
                        
                    default:
                        console.error('알 수 없는 섹션 타입:', sectionType);
                        return;
                }
                
                try {
                    const response = await fetchWithAuth('/api/tutors', {
                        method: 'PUT',
                        body: formData
                    });
                    
                    const result = await response.json();
                    if (result.success) {
                        // 성공 메시지
                        const sectionNames = {
                            'basic': '기본 정보',
                            'profile': '프로필',
                            'account': '계좌 정보',
                            'documents': '서류 정보',
                            'security': '보안 설정'
                        };
                        alert(`${sectionNames[sectionType] || '섹션'}이(가) 저장되었습니다.`);
                        
                        // 사이드바 프로필 이미지 업데이트 (basic 섹션 저장 시)
                        if (sectionType === 'basic' && profileState.profileImgFile) {
                            const previewUrl = URL.createObjectURL(profileState.profileImgFile);
                            const sidebarProfileImg = document.getElementById('sidebarProfileImg');
                            if (sidebarProfileImg) {
                                sidebarProfileImg.classList.remove('bg-primary');
                                sidebarProfileImg.innerHTML = `<img src="${previewUrl}" class="rounded-circle w-100 h-100 object-fit-cover" alt="프로필">`;
                            }
                        } 
                        
                    } else {
                        alert(result.message || `${sectionType} 섹션 저장에 실패했습니다.`);
                    }
                } catch (error) {
                    console.error('섹션 저장 실패:', error);
                    alert('저장 중 오류가 발생했습니다.');
                }
            }

            // 파일 용량 표시
            function formatFileSize(bytes) {
                if (!bytes && bytes !== 0) return '';
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
            }

            // 내 서류 목록 렌더링
            function renderDocumentList(docs) {
                // 학력, 학위, 자격증별로 분리
                const typeMap = { EDUCATION: [], DEGREE: [], CERTIFICATE: [] };
                docs.forEach(d => {
                    if (typeMap[d.docType]) typeMap[d.docType].push(d);
                });
                // 각 리스트 렌더링
                [
                    { type: 'EDUCATION', listId: 'editDocEducationList', cardId: 'editDocEducationListCard' },
                    { type: 'DEGREE', listId: 'editDocDegreeList', cardId: 'editDocDegreeListCard' },
                    { type: 'CERTIFICATE', listId: 'editDocCertificateList', cardId: 'editDocCertificateListCard' }
                ].forEach(({type, listId, cardId}) => {
                    const container = document.getElementById(listId);
                    const card = document.getElementById(cardId);
                    if (!container || !card) return;
                    container.innerHTML = '';
                    const files = typeMap[type];
                    if (!files || files.length === 0) {
                        card.style.display = 'none';
                        return;
                    }
                    card.style.display = 'block';
                    // 템플릿 가져오기
                    const template = card.querySelector('.file-item-template li');
                    if (!template) return;
                    files.forEach((f, idx) => {
                        const clone = template.cloneNode(true);
                        const fileNameSpan = clone.querySelector('.file-name');
                        const fileSizeSpan = clone.querySelector('.file-size');
                        if (fileNameSpan) fileNameSpan.textContent = f.originalName || f.name || '';
                        if (fileSizeSpan) fileSizeSpan.textContent = f.size ? '(' + formatFileSize(f.size) + ')' : '';
                        // 삭제 버튼
                        const deleteBtn = clone.querySelector('.delete-btn');
                        if (deleteBtn) {
                            deleteBtn.addEventListener('click', () => deleteDocument(f.id));
                        }
                        // 미리보기(이미지)
                        if (f.filePath && /\.(jpg|jpeg|png)$/i.test(f.filePath)) {
                            const img = document.createElement('img');
                            img.src = f.filePath;
                            img.alt = '미리보기';
                            img.style.maxHeight = '40px';
                            img.style.marginRight = '8px';
                            fileNameSpan?.prepend(img);
                        }
                        container.appendChild(clone);
                    });
                });
            }

            // 서류 목록 불러오기
            async function loadDocumentList() {
                const res = await fetchWithAuth('/api/tutors/documents');
                if (!res.ok) return;
                const result = await res.json();
                const docs = (result && result.data) || [];
                renderDocumentList(docs);
            }

            // 서류 삭제
            async function deleteDocument(docId) {
                if (!confirm('정말 삭제하시겠습니까?')) return;
                const res = await fetchWithAuth(`/api/tutors/documents/${docId}`, { method: 'DELETE' });
                if (res.ok) {
                    await loadDocumentList();
                } else {
                    alert('삭제 실패');
                }
            }

            // 파일 업로드
            async function uploadDocs(docType, files) {
                for (const file of files) {
                    const fd = new FormData();
                    fd.set('docType', docType);
                    fd.set('file', file);
                    const res = await fetchWithAuth('/api/tutors/documents', {
                        method: 'POST',
                        body: fd
                    });
                    if (!res.ok) throw new Error('upload failed');
                }
            }

            async function initDocumentSection() {
                // 파일 배열 전역 관리 (섹션별 유지)
                window.educationFiles = window.educationFiles || [];
                window.degreeFiles = window.degreeFiles || [];
                window.certificateFiles = window.certificateFiles || [];

                function renderSelectedFiles(type) {
                    let files = [];
                    let listId = '', cardId = '';
                    if (type === 'EDUCATION') {
                        files = window.educationFiles;
                        listId = 'editDocEducationList';
                        cardId = 'editDocEducationListCard';
                    } else if (type === 'DEGREE') {
                        files = window.degreeFiles;
                        listId = 'editDocDegreeList';
                        cardId = 'editDocDegreeListCard';
                    } else if (type === 'CERTIFICATE') {
                        files = window.certificateFiles;
                        listId = 'editDocCertificateList';
                        cardId = 'editDocCertificateListCard';
                    }
                    const container = document.getElementById(listId);
                    const card = document.getElementById(cardId);
                    if (!container || !card) return;
                    container.innerHTML = '';
                    if (!files || files.length === 0) {
                        card.style.display = 'none';
                        return;
                    }
                    card.style.display = 'block';
                    const template = card.querySelector('.file-item-template li');
                    if (!template) return;
                    files.forEach((f) => {
                        const clone = template.cloneNode(true);
                        const fileNameSpan = clone.querySelector('.file-name');
                        const fileSizeSpan = clone.querySelector('.file-size');
                        if (fileNameSpan) fileNameSpan.textContent = f.name || f.originalName || '';
                        if (fileSizeSpan) fileSizeSpan.textContent = '(' + formatFileSize(f.size) + ')';
                        // 삭제 버튼
                        const deleteBtn = clone.querySelector('.delete-btn');
                        if (deleteBtn) {
                            deleteBtn.addEventListener('click', () => {
                                if (type === 'EDUCATION') {
                                    window.educationFiles = window.educationFiles.filter(file => file !== f);
                                    renderSelectedFiles('EDUCATION');
                                } else if (type === 'DEGREE') {
                                    window.degreeFiles = window.degreeFiles.filter(file => file !== f);
                                    renderSelectedFiles('DEGREE');
                                } else if (type === 'CERTIFICATE') {
                                    window.certificateFiles = window.certificateFiles.filter(file => file !== f);
                                    renderSelectedFiles('CERTIFICATE');
                                }
                            });
                        }
                        // 수정 버튼(선택한 파일로 교체)
                        const editBtn = clone.querySelector('.edit-btn');
                        if (editBtn) {
                            editBtn.addEventListener('click', () => {
                                let input = null;
                                if (type === 'EDUCATION') input = document.getElementById('editDocEducation');
                                else if (type === 'DEGREE') input = document.getElementById('editDocDegree');
                                else if (type === 'CERTIFICATE') input = document.getElementById('editDocCertificate');
                                if (input) {
                                    input.onchange = (e) => {
                                        const newFile = e.target.files[0];
                                        if (newFile) {
                                            if (type === 'EDUCATION') {
                                                window.educationFiles = window.educationFiles.map(file => file === f ? newFile : file);
                                                renderSelectedFiles('EDUCATION');
                                            } else if (type === 'DEGREE') {
                                                window.degreeFiles = window.degreeFiles.map(file => file === f ? newFile : file);
                                                renderSelectedFiles('DEGREE');
                                            } else if (type === 'CERTIFICATE') {
                                                window.certificateFiles = window.certificateFiles.map(file => file === f ? newFile : file);
                                                renderSelectedFiles('CERTIFICATE');
                                            }
                                        }
                                        input.value = '';
                                        input.onchange = null;
                                    };
                                    input.click();
                                }
                            });
                        }
                        container.appendChild(clone);
                    });
                }

                const educationInput = document.getElementById('editDocEducation');
                const degreeInput = document.getElementById('editDocDegree');
                const certificateInput = document.getElementById('editDocCertificate');
                if (educationInput) {
                    educationInput.addEventListener('change', (e) => {
                        window.educationFiles = Array.from(e.target.files);
                        renderSelectedFiles('EDUCATION');
                    });
                }
                if (degreeInput) {
                    degreeInput.addEventListener('change', (e) => {
                        window.degreeFiles = Array.from(e.target.files);
                        renderSelectedFiles('DEGREE');
                    });
                }
                if (certificateInput) {
                    certificateInput.addEventListener('change', (e) => {
                        window.certificateFiles = Array.from(e.target.files);
                        renderSelectedFiles('CERTIFICATE');
                    });
                }

                const uploadBtn = document.getElementById('btnDocUpload');
                if (uploadBtn) {
                    uploadBtn.addEventListener('click', async () => {
                        try {
                            await uploadDocs('EDUCATION', window.educationFiles);
                            await uploadDocs('DEGREE', window.degreeFiles);
                            await uploadDocs('CERTIFICATE', window.certificateFiles);
                            // 업로드 후 미리보기 리셋
                            window.educationFiles = [];
                            window.degreeFiles = [];
                            window.certificateFiles = [];
                            renderSelectedFiles('EDUCATION');
                            renderSelectedFiles('DEGREE');
                            renderSelectedFiles('CERTIFICATE');
                            // 내 서류 목록 테이블(docList)에만 남김
                            const res = await fetchWithAuth('/api/tutors/documents');
                            if (res.ok) {
                                const result = await res.json();
                                const docs = (result && result.data) || [];
                                renderDocTable(docs);
                            }
                            alert('서류 업로드가 완료되었습니다.');
                        } catch (e) {
                            console.error(e);
                            alert('서류 업로드 중 오류가 발생했습니다.');
                        }
                    });
                }

                // 내 서류 목록 테이블 렌더링 함수
                function renderDocTable(docs) {
                    const listEl = document.getElementById('docList');
                    if (!listEl) return;
                    listEl.innerHTML = docs.map(d => `
                        <tr>
                            <td>${({EDUCATION:'학력', DEGREE:'학위', CERTIFICATE:'자격증'}[d.docType] || d.docType)}</td>
                            <td>${d.originalName || '-'}</td>
                            <td class="muted">${d.createdAt ? d.createdAt.substring(0,10) : ''}</td>
                            <td>${d.reviewedAt ? '검토 완료' : '대기'}</td>
                        </tr>
                    `).join('');
                }

                // documents 섹션 로드 시 docList 렌더링 및 미리보기 렌더링
                (async function(){
                    try {
                        const res = await fetchWithAuth('/api/tutors/documents');
                        if (!res.ok) return;
                        const result = await res.json();
                        const docs = (result && result.data) || [];
                        renderDocTable(docs);
                    } catch (e) {
                        // 에러 무시
                    }
                    renderSelectedFiles('EDUCATION');
                    renderSelectedFiles('DEGREE');
                    renderSelectedFiles('CERTIFICATE');
                })();
            }

            // 최초 섹션
            const initial = new URLSearchParams(location.search).get('section') || 'basic';
            showSection(sections.includes(initial) ? initial : 'basic');
        </script>
    </div>
</div>
