<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main_layout}">

    <th:block layout:fragment="extra-css">
    <link rel="stylesheet" href="/css/tutor-register-admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f8fafc; }
        .edit-shell { display: flex; gap: 24px; }
        .edit-sidebar { width: 280px; flex: 0 0 280px; position: sticky; top: 90px; height: fit-content; }
        .edit-card { border-radius: 16px; border: 1px solid #e5e7eb; }
        .edit-menu .list-group-item { border: 0; border-radius: 12px; padding: 12px 14px; color: #334155; cursor: pointer; }
        .edit-menu .list-group-item.active { background: #2563eb; color: #fff; }
        .edit-menu .list-group-item:hover:not(.active) { background: #f1f5f9; }
        .panel-title { font-weight: 800; }
        .muted { color: #64748b; }
        .divider { height: 1px; background: #e5e7eb; margin: 14px 0; }
        .form-label { font-weight: 600; color: #334155; }
        .btn-pill { border-radius: 999px; }
        
        @media (max-width: 992px) {
            .edit-shell { flex-direction: column; }
            .edit-sidebar { width: 100%; position: static; }
        }
    </style>
    </th:block>

    <div layout:fragment="content">
        <div class="container py-4">
            <!-- 헤더 -->
            <div class="d-flex justify-content-between align-items-end mb-4">
                <div>
                    <h2 class="fw-bold mb-1">프로필 수정</h2>
                    <div class="muted small">튜터 정보를 수정하세요</div>
                </div>
                <div class="d-flex gap-2">
                    <a href="/tutor/mypage" class="btn btn-outline-secondary btn-sm btn-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> 마이페이지로
                    </a>
                </div>
            </div>

            <div class="edit-shell">
                <!-- 사이드바 -->
                <aside class="edit-sidebar">
                    <div class="card edit-card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <div id="sidebarProfileImg" class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width:60px;height:60px;font-size:1.5rem;">
                                    👨‍🏫
                                </div>
                                <div>
                                    <div class="fw-bold" id="sidebarName">튜터</div>
                                    <div class="muted small" id="sidebarLoginId">아이디</div>
                                </div>
                            </div>

                            <div class="divider"></div>

                            <div class="list-group edit-menu">
                                <a class="list-group-item active" data-section="basic">
                                    <i class="bi bi-person me-2"></i> 기본 정보
                                </a>
                                <a class="list-group-item" data-section="profile">
                                    <i class="bi bi-card-text me-2"></i> 프로필
                                </a>
                                <a class="list-group-item" data-section="account">
                                    <i class="bi bi-bank me-2"></i> 계좌 정보
                                </a>
                                <a class="list-group-item" data-section="documents">
                                    <i class="bi bi-file-earmark-arrow-up me-2"></i> 서류 업로드
                                </a>
                                <a class="list-group-item" data-section="security">
                                    <i class="bi bi-shield-lock me-2"></i> 보안
                                </a>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- 메인 컨텐츠 -->
                <main class="flex-grow-1">
                    <form id="profileEditForm">
                        <div id="profileEditContainer"></div>

                        <!-- 저장 버튼 -->
                        <div class="d-flex justify-content-end gap-2">
                            <a href="/tutor/mypage" class="btn btn-outline-secondary px-4">취소</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg me-1"></i> 저장
                            </button>
                        </div>
                    </form>
                </main>
            </div>
        </div>

        <script>
            const getFallbackToken = () => localStorage.getItem('accessToken');
            const getAuthHeaders = () => {
                if (typeof buildAuthHeaders === 'function') {
                    return buildAuthHeaders();
                }
                const token = getFallbackToken();
                return token ? { 'Authorization': `Bearer ${token}` } : {};
            };

            async function ensureAuth() {
                const token = (typeof getAccessToken === 'function') ? getAccessToken() : getFallbackToken();
                if (token) return true;
                if (typeof refreshAccessToken === 'function') {
                    return await refreshAccessToken();
                }
                return false;
            }

            async function fetchWithAuth(url, options = {}) {
                const headers = { ...(options.headers || {}), ...getAuthHeaders() };
                const response = await fetch(url, {
                    ...options,
                    headers,
                    credentials: 'include'
                });

                if (response.status === 401 && typeof refreshAccessToken === 'function') {
                    const refreshed = await refreshAccessToken();
                    if (refreshed) {
                        const retryHeaders = { ...(options.headers || {}), ...getAuthHeaders() };
                        return fetch(url, {
                            ...options,
                            headers: retryHeaders,
                            credentials: 'include'
                        });
                    }
                }

                return response;
            }

            const sections = ["basic","profile","account","documents","security"];
            const profileState = {
                loginId: "",
                name: "",
                phone: "",
                headline: "",
                bio: "",
                selfIntro: "",
                videoUrl: "",
                bankName: "",
                accountNumber: "",
                accountHolder: "",
                password: "",
                passwordConfirm: "",
                profileImgFile: null,
                profileImgUrl: ""
            };

            function collectSectionValues(){
                if (document.getElementById('editName')) profileState.name = document.getElementById('editName').value || "";
                if (document.getElementById('editPhone')) profileState.phone = document.getElementById('editPhone').value || "";
                if (document.getElementById('editHeadline')) profileState.headline = document.getElementById('editHeadline').value || "";
                if (document.getElementById('editBio')) profileState.bio = document.getElementById('editBio').value || "";
                if (document.getElementById('editSelfIntro')) profileState.selfIntro = document.getElementById('editSelfIntro').value || "";
                if (document.getElementById('editVideoUrl')) profileState.videoUrl = document.getElementById('editVideoUrl').value || "";
                if (document.getElementById('editBankName')) profileState.bankName = document.getElementById('editBankName').value || "";
                if (document.getElementById('editAccountNumber')) profileState.accountNumber = document.getElementById('editAccountNumber').value || "";
                if (document.getElementById('editAccountHolder')) profileState.accountHolder = document.getElementById('editAccountHolder').value || "";
                if (document.getElementById('editPassword')) profileState.password = document.getElementById('editPassword').value || "";
                if (document.getElementById('editPasswordConfirm')) profileState.passwordConfirm = document.getElementById('editPasswordConfirm').value || "";

                const profileImgInput = document.getElementById('editProfileImg');
                if (profileImgInput && profileImgInput.files[0]) {
                    profileState.profileImgFile = profileImgInput.files[0];
                }
            }

            function applyStateToSection(){
                if (document.getElementById('editName')) document.getElementById('editName').value = profileState.name || "";
                if (document.getElementById('editPhone')) document.getElementById('editPhone').value = profileState.phone || "";
                if (document.getElementById('editHeadline')) document.getElementById('editHeadline').value = profileState.headline || "";
                if (document.getElementById('editBio')) document.getElementById('editBio').value = profileState.bio || "";
                if (document.getElementById('editSelfIntro')) document.getElementById('editSelfIntro').value = profileState.selfIntro || "";
                if (document.getElementById('editVideoUrl')) document.getElementById('editVideoUrl').value = profileState.videoUrl || "";
                if (document.getElementById('editBankName')) document.getElementById('editBankName').value = profileState.bankName || "";
                if (document.getElementById('editAccountNumber')) document.getElementById('editAccountNumber').value = profileState.accountNumber || "";
                if (document.getElementById('editAccountHolder')) document.getElementById('editAccountHolder').value = profileState.accountHolder || "";
                if (document.getElementById('currentProfileImg') && profileState.profileImgUrl) {
                    document.getElementById('currentProfileImg').innerHTML =
                        `<img src="${profileState.profileImgUrl}" class="rounded-circle w-100 h-100 object-fit-cover" alt="프로필">`;
                }
            }

            let currentSection = "basic";
            let securityVerified = false;

            async function verifySecurityAccessInline(){
                if (!profileState.loginId) {
                    alert('아이디 정보를 불러오지 못했습니다.');
                    return false;
                }

                const currentPassword = document.getElementById('securityPassword')?.value || "";
                if (!currentPassword) {
                    document.getElementById('securityError')?.classList.remove('d-none');
                    document.getElementById('securityError').textContent = '현재 비밀번호를 입력하세요.';
                    return false;
                }

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: profileState.loginId, password: currentPassword }),
                    credentials: 'include'
                });
                const result = await response.json();
                if (!result || result.success === false) {
                    document.getElementById('securityError')?.classList.remove('d-none');
                    document.getElementById('securityError').textContent = '비밀번호가 올바르지 않습니다.';
                    return false;
                }

                securityVerified = true;
                const pwdInput = document.getElementById('securityPassword');
                const verifyBtn = document.getElementById('btnSecurityVerify');
                if (pwdInput) pwdInput.disabled = true;
                if (verifyBtn) {
                    verifyBtn.disabled = true;
                    verifyBtn.textContent = '확인 완료';
                }
                document.getElementById('securityGate')?.classList.add('d-none');
                document.getElementById('securityForm')?.classList.remove('d-none');
                return true;
            }

            async function showSection(key){
                const safeKey = sections.includes(key) ? key : "basic";
                collectSectionValues();

                document.querySelectorAll('.edit-menu .list-group-item').forEach(i => {
                    i.classList.toggle('active', i.dataset.section === safeKey);
                });

                const container = document.getElementById('profileEditContainer');
                if (!container) return;

                try {
                    const res = await fetch(`/tutor/profile-edit/partial/${safeKey}`);
                    if (!res.ok) throw new Error('load fail');
                    container.innerHTML = await res.text();
                    applyStateToSection();
                    bindSectionHandlers(safeKey);
                    currentSection = safeKey;
                } catch (e) {
                    container.innerHTML = `
                      <div class="card edit-card shadow-sm">
                        <div class="card-body">
                          <div class="panel-title mb-1">불러오기 실패</div>
                          <div class="muted small">잠시 후 다시 시도해주세요.</div>
                        </div>
                      </div>
                    `;
                }
            }

            function bindSectionHandlers(key){
                if (key === "documents") {
                    initDocumentSection();
                }
                if (key === "security") {
                    initSecuritySection();
                }
            }

            function initSecuritySection(){
                const gate = document.getElementById('securityGate');
                const form = document.getElementById('securityForm');
                if (!gate || !form) return;

                if (securityVerified) {
                    gate.classList.add('d-none');
                    form.classList.remove('d-none');
                } else {
                    gate.classList.remove('d-none');
                    form.classList.add('d-none');
                }

                document.getElementById('btnSecurityVerify')?.addEventListener('click', async () => {
                    await verifySecurityAccessInline();
                });

                document.getElementById('securityPassword')?.addEventListener('keydown', async (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        await verifySecurityAccessInline();
                    }
                });
            }

            // 섹션 전환
            document.querySelectorAll('.edit-menu .list-group-item').forEach(item => {
                item.addEventListener('click', function() {
                    showSection(this.dataset.section);
                });
            });

            // 페이지 로드 시 데이터 바인딩
            document.addEventListener('DOMContentLoaded', async function() {
                try {
                    const authed = await ensureAuth();
                    if (!authed) {
                        location.href = '/auth/login';
                        return;
                    }

                    const response = await fetchWithAuth('/api/tutors/me');
                    if (!response.ok) throw new Error('Failed to fetch');

                    const result = await response.json();
                    if (result.success && result.data) {
                        const profile = result.data.tutorProfile;
                        if (profile) {
                            // 사이드바
                            document.getElementById('sidebarName').textContent = profile.name || '튜터';
                            document.getElementById('sidebarLoginId').textContent = profile.email || '';
                            if (profile.profileImg) {
                                document.getElementById('sidebarProfileImg').innerHTML = 
                                    `<img src="${profile.profileImg}" class="rounded-circle w-100 h-100 object-fit-cover" alt="프로필">`;
                                profileState.profileImgUrl = profile.profileImg;
                            }

                            // 상태 저장
                            profileState.loginId = profile.email || '';
                            profileState.name = profile.name || '';
                            profileState.phone = profile.phone || '';
                            profileState.headline = profile.headline || '';
                            profileState.bio = profile.bio || '';
                            profileState.selfIntro = profile.selfIntro || '';
                            profileState.videoUrl = profile.videoUrl || '';
                            profileState.bankName = profile.bankName || '';
                            profileState.accountNumber = profile.accountNumber || '';
                            profileState.accountHolder = profile.accountHolder || '';

                            applyStateToSection();
                        }
                    }
                } catch (e) {
                    console.warn('프로필 데이터 로드 실패', e);
                }
            });

            // 폼 제출
            document.getElementById('profileEditForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                collectSectionValues();

                // 비밀번호 확인
                if (profileState.password && profileState.password !== profileState.passwordConfirm) {
                    alert('비밀번호가 일치하지 않습니다.');
                    return;
                }

                const formData = new FormData();
                formData.set('name', profileState.name || '');
                formData.set('phone', profileState.phone || '');
                formData.set('headline', profileState.headline || '');
                formData.set('bio', profileState.bio || '');
                formData.set('selfIntro', profileState.selfIntro || '');
                formData.set('videoUrl', profileState.videoUrl || '');
                formData.set('bankName', profileState.bankName || '');
                formData.set('accountNumber', profileState.accountNumber || '');
                formData.set('accountHolder', profileState.accountHolder || '');
                if (profileState.password) formData.set('password', profileState.password);
                if (profileState.passwordConfirm) formData.set('passwordConfirm', profileState.passwordConfirm);

                if (profileState.profileImgFile) {
                    formData.set('profileImg', profileState.profileImgFile);
                }

                try {
                    const response = await fetchWithAuth('/api/tutors', {
                        method: 'PUT',
                        body: formData
                    });

                    const result = await response.json();
                    if (result.success) {
                        alert('프로필이 수정되었습니다.');
                        location.href = '/tutor/mypage';
                    } else {
                        alert(result.message || '프로필 수정에 실패했습니다.');
                    }
                } catch (error) {
                    console.error('프로필 수정 실패:', error);
                    alert('프로필 수정 중 오류가 발생했습니다.');
                }
            });

            async function initDocumentSection(){
                const uploadBtn = document.getElementById('btnDocUpload');
                if (!uploadBtn) return;

                uploadBtn.addEventListener('click', async () => {
                    const educationFiles = document.getElementById('editDocEducation')?.files || [];
                    const degreeFiles = document.getElementById('editDocDegree')?.files || [];
                    const certificateFiles = document.getElementById('editDocCertificate')?.files || [];

                    try {
                        await uploadDocs('EDUCATION', educationFiles);
                        await uploadDocs('DEGREE', degreeFiles);
                        await uploadDocs('CERTIFICATE', certificateFiles);
                        await loadDocumentList();
                        alert('서류 업로드가 완료되었습니다.');
                    } catch (e) {
                        console.error(e);
                        alert('서류 업로드 중 오류가 발생했습니다.');
                    }
                });

                await loadDocumentList();
            }

            async function uploadDocs(docType, files){
                for (const file of files) {
                    const fd = new FormData();
                    fd.set('docType', docType);
                    fd.set('file', file);

                    const res = await fetchWithAuth('/api/tutors/documents', {
                        method: 'POST',
                        body: fd
                    });
                    if (!res.ok) throw new Error('upload failed');
                }
            }

            async function loadDocumentList(){
                const listEl = document.getElementById('docList');
                if (!listEl) return;

                const res = await fetchWithAuth('/api/tutors/documents');
                if (!res.ok) return;
                const result = await res.json();
                const docs = (result && result.data) || [];

                listEl.innerHTML = docs.map(d => `
                  <tr>
                    <td>${({EDUCATION:'학력', DEGREE:'학위', CERTIFICATE:'자격증'}[d.docType] || d.docType)}</td>
                    <td>${d.originalName || '-'}</td>
                    <td class="muted">${d.createdAt ? d.createdAt.substring(0,10) : ''}</td>
                    <td>${d.reviewedAt ? '검토 완료' : '대기'}</td>
                  </tr>
                `).join('');
            }

            // 최초 섹션
            const initial = new URLSearchParams(location.search).get('section') || 'basic';
            showSection(sections.includes(initial) ? initial : 'basic');
        </script>
    </div>
</div>
