<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main_layout}">

    <div layout:fragment="content">
        <div class="container py-5" style="max-width: 720px;">
            <div class="mb-4 text-center">
                <h2 class="h4 fw-bold">튜터 추가 정보</h2>
                <p class="text-muted mb-0">프로필 정보를 입력해 주세요.</p>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form id="tutorProfileForm">
                        <div class="mb-4">
                            <h5 class="fw-bold">1. 기본 정보</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">이름</label>
                                    <input type="text" class="form-control" id="basicName" placeholder="이름">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">연락처</label>
                                    <input type="text" class="form-control" id="basicPhone" placeholder="010-0000-0000">
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">2. 사진</h5>
                            <input type="file" class="form-control" id="profileImage" accept="image/*">
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">3. 교육 관련 학위 및 증명서</h5>
                            <input type="file" class="form-control" id="educationCertificate" multiple>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">4. 학력증명서</h5>
                            <input type="file" class="form-control" id="academicCertificate" multiple>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">5. 근무 경력</h5>
                            <textarea class="form-control" id="career" rows="3" placeholder="근무 경력을 입력하세요"></textarea>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">6. 자기소개서</h5>
                            <textarea class="form-control" id="selfIntro" rows="4" placeholder="자기소개서를 입력하세요"></textarea>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">7. 수업 과목</h5>
                            <input type="text" class="form-control" id="lessonSubjects" placeholder="예) 영어 회화, 토익">
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">8. 동영상 소개서</h5>
                            <input type="url" class="form-control" id="introVideoUrl" placeholder="https://">
                            <small class="text-muted">또는 파일 업로드</small>
                            <input type="file" class="form-control mt-2" id="introVideoFile" accept="video/*">
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">9. 수업 가능 시간대</h5>
                            <textarea class="form-control" id="availableTime" rows="3" placeholder="예) 평일 19~22시, 주말 오전"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">한 줄 소개</label>
                            <input type="text" class="form-control" id="headline" placeholder="예) 중고등 수학 10년 경력">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">소개</label>
                            <textarea class="form-control" id="bio" rows="5" placeholder="튜터 소개를 입력하세요"></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">소개 영상 URL (선택)</label>
                            <input type="url" class="form-control" id="videoUrl" placeholder="https://">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">일반 분야</label>
                            <div id="generalFields" class="d-flex flex-wrap gap-2"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">분야별</label>
                            <div id="domainFields" class="d-flex flex-wrap gap-2"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">저장하고 계속하기</button>
                    </form>
                </div>
            </div>
        </div>

        <script>
            function getMemoryAccessToken() {
                return typeof getAccessToken === 'function' ? getAccessToken() : null;
            }

            function setMemoryAccessToken(token) {
                if (typeof setAccessToken === 'function') {
                    setAccessToken(token);
                }
            }

            function buildAuthHeaders() {
                const accessToken = getMemoryAccessToken();
                return accessToken ? { Authorization: `Bearer ${accessToken}` } : {};
            }

            async function fetchMe() {
                let response = await fetch('/api/users/me', {
                    headers: buildAuthHeaders()
                });
                if (response.ok) {
                    const data = await response.json();
                    return data && data.success ? data.data : null;
                }

                const refreshResponse = await fetch('/api/auth/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                if (!refreshResponse.ok) {
                    return null;
                }
                const refreshData = await refreshResponse.json();
                if (refreshData && refreshData.success && refreshData.data && refreshData.data.accessToken) {
                    setMemoryAccessToken(refreshData.data.accessToken);
                }

                response = await fetch('/api/users/me', {
                    headers: buildAuthHeaders()
                });
                if (!response.ok) {
                    return null;
                }
                const data = await response.json();
                return data && data.success ? data.data : null;
            }

            function isTutor(authList) {
                if (!Array.isArray(authList)) {
                    return false;
                }
                return authList.some((a) =>
                    a.auth === 'ROLE_TUTOR' ||
                    a.auth === 'ROLE_TUTOR_PENDING' ||
                    a === 'ROLE_TUTOR' ||
                    a === 'ROLE_TUTOR_PENDING'
                );
            }

            function renderFieldOptions(fields) {
                const generalContainer = document.getElementById('generalFields');
                const domainContainer = document.getElementById('domainFields');

                if (!generalContainer || !domainContainer) {
                    return;
                }

                generalContainer.innerHTML = '';
                domainContainer.innerHTML = '';

                fields.forEach((field) => {
                    const wrapper = document.createElement('label');
                    wrapper.className = 'btn btn-sm btn-outline-secondary rounded-pill';

                    const input = document.createElement('input');
                    input.type = 'checkbox';
                    input.className = 'visually-hidden';
                    input.value = field.id;

                    const text = document.createElement('span');
                    text.textContent = field.name;

                    input.addEventListener('change', () => {
                        if (input.checked) {
                            wrapper.classList.add('btn-primary');
                            wrapper.classList.remove('btn-outline-secondary');
                        } else {
                            wrapper.classList.add('btn-outline-secondary');
                            wrapper.classList.remove('btn-primary');
                        }
                    });

                    wrapper.appendChild(input);
                    wrapper.appendChild(text);

                    if (field.category === 'DOMAIN') {
                        domainContainer.appendChild(wrapper);
                    } else {
                        generalContainer.appendChild(wrapper);
                    }
                });
            }

            async function loadFields() {
                const response = await fetch('/api/language-fields');
                if (!response.ok) {
                    return;
                }
                const data = await response.json();
                if (!data || data.success === false || !Array.isArray(data.data)) {
                    return;
                }
                renderFieldOptions(data.data);
            }

            document.addEventListener('DOMContentLoaded', async () => {
                const me = await fetchMe();
                if (!me || !isTutor(me.authList)) {
                    location.href = '/login';
                    return;
                }

                await loadFields();
            });

            document.getElementById('tutorProfileForm').addEventListener('submit', async (event) => {
                event.preventDefault();

                const selectedFieldIds = Array.from(
                    document.querySelectorAll('#generalFields input:checked, #domainFields input:checked')
                ).map((input) => input.value);

                const payload = {
                    headline: document.getElementById('headline').value,
                    bio: document.getElementById('bio').value,
                    videoUrl: document.getElementById('videoUrl').value,
                    fieldIds: selectedFieldIds
                };

                const response = await fetch('/api/tutors/profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...buildAuthHeaders()
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!data.success) {
                    alert(data.message || '튜터 정보를 저장하지 못했습니다.');
                    return;
                }

                location.href = '/tutor/mypage';
            });
        </script>
    </div>
</div>
