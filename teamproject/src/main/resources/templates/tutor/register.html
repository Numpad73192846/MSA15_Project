<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main_layout}">

    <div layout:fragment="content">
        <div class="container py-5" style="max-width: 720px;">
            <div class="mb-4 text-center">
                <h2 class="h4 fw-bold">튜터 회원가입 (1/4단계)</h2>
                <p class="text-muted mb-0">기본 정보를 입력해 주세요.</p>
            </div>

            <div class="progress mb-4" style="height: 8px;">
                <div class="progress-bar" role="progressbar" style="width: 25%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form id="tutorProfileForm">
                        <div class="mb-4">
                            <h5 class="fw-bold">1. 기본 정보</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">이름</label>
                                    <input type="text" class="form-control" id="basicName" placeholder="이름" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">연락처</label>
                                    <input type="text" class="form-control" id="basicPhone" placeholder="010-0000-0000" required>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">2. 사진</h5>
                            <input type="file" class="form-control" id="profileImage" accept="image/*">
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">3. 한 줄 소개</h5>
                            <input type="text" class="form-control" id="headline" placeholder="예) 중고등 수학 10년 경력" required>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">4. 소개</h5>
                            <textarea class="form-control" id="bio" rows="5" placeholder="튜터 소개를 입력하세요" required></textarea>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">5. 동영상 소개</h5>
                            <label class="form-label">소개 영상 URL</label>
                            <input type="url" class="form-control mb-2" id="videoUrl" placeholder="https://">
                            <small class="text-muted">또는 파일 업로드</small>
                            <input type="file" class="form-control mt-2" id="introVideoFile" accept="video/*">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">다음 단계로</button>
                    </form>
                </div>
            </div>
        </div>

        <script>
            function getMemoryAccessToken() {
                return typeof getAccessToken === 'function' ? getAccessToken() : null;
            }

            function setMemoryAccessToken(token) {
                if (typeof setAccessToken === 'function') {
                    setAccessToken(token);
                }
            }

            function buildAuthHeaders() {
                const accessToken = getMemoryAccessToken();
                return accessToken ? { Authorization: `Bearer ${accessToken}` } : {};
            }

            async function fetchMe() {
                let response = await fetch('/api/users/me', {
                    headers: buildAuthHeaders()
                });
                if (response.ok) {
                    const data = await response.json();
                    return data && data.success ? data.data : null;
                }

                const refreshResponse = await fetch('/api/auth/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                if (!refreshResponse.ok) {
                    return null;
                }
                const refreshData = await refreshResponse.json();
                if (refreshData && refreshData.success && refreshData.data && refreshData.data.accessToken) {
                    setMemoryAccessToken(refreshData.data.accessToken);
                }

                response = await fetch('/api/users/me', {
                    headers: buildAuthHeaders()
                });
                if (!response.ok) {
                    return null;
                }
                const data = await response.json();
                return data && data.success ? data.data : null;
            }

            function isTutor(authList) {
                if (!Array.isArray(authList)) {
                    return false;
                }
                return authList.some((a) =>
                    a.auth === 'ROLE_TUTOR' ||
                    a.auth === 'ROLE_TUTOR_PENDING' ||
                    a === 'ROLE_TUTOR' ||
                    a === 'ROLE_TUTOR_PENDING'
                );
            }

            document.addEventListener('DOMContentLoaded', async () => {
                const me = await fetchMe();
                
                if (!me) {
                    alert('로그인이 필요합니다.');
                    location.href = '/login';
                    return;
                }

                // 이전에 저장된 데이터 불러오기
                const savedData = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                if (savedData.basicName) document.getElementById('basicName').value = savedData.basicName;
                if (savedData.basicPhone) document.getElementById('basicPhone').value = savedData.basicPhone;
                if (savedData.headline) document.getElementById('headline').value = savedData.headline;
                if (savedData.bio) document.getElementById('bio').value = savedData.bio;
                if (savedData.videoUrl) document.getElementById('videoUrl').value = savedData.videoUrl;
            });

            document.getElementById('tutorProfileForm').addEventListener('submit', async (event) => {
                event.preventDefault();

                // 1단계 데이터 저장
                const step1Data = {
                    basicName: document.getElementById('basicName').value,
                    basicPhone: document.getElementById('basicPhone').value,
                    headline: document.getElementById('headline').value,
                    bio: document.getElementById('bio').value,
                    videoUrl: document.getElementById('videoUrl').value
                };

                // 파일 처리
                const profileImage = document.getElementById('profileImage').files[0];
                const introVideoFile = document.getElementById('introVideoFile').files[0];

                try {
                    if (profileImage) {
                        const reader = new FileReader();
                        await new Promise((resolve, reject) => {
                            reader.onload = () => {
                                step1Data.profileImage = reader.result;
                                resolve();
                            };
                            reader.onerror = reject;
                            reader.readAsDataURL(profileImage);
                        });
                    }
                    if (introVideoFile) {
                        step1Data.introVideoFileName = introVideoFile.name;
                        step1Data.introVideoFileSize = introVideoFile.size;
                        const reader = new FileReader();
                        await new Promise((resolve, reject) => {
                            reader.onload = () => {
                                step1Data.introVideo = reader.result;
                                resolve();
                            };
                            reader.onerror = reject;
                            reader.readAsDataURL(introVideoFile);
                        });
                    }
                } catch (error) {
                    console.error('파일 처리 중 오류:', error);
                    alert('파일 처리 중 오류가 발생했습니다.');
                    return;
                }

                const existing = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                if (!step1Data.profileImage && existing.profileImage) {
                    step1Data.profileImage = existing.profileImage;
                }
                if (!step1Data.introVideo && existing.introVideo) {
                    step1Data.introVideo = existing.introVideo;
                    step1Data.introVideoFileName = existing.introVideoFileName;
                    step1Data.introVideoFileSize = existing.introVideoFileSize;
                }

                sessionStorage.setItem('tutorRegisterStep1', JSON.stringify(step1Data));
                window.location.href = '/tutor/register1';
            });
        </script>
    </div>
</div>

                            <div id="profileImgCard" class="card my-2" style="display:none;">
                                <div class="row g-0 align-items-center">
                                    <div class="col-md-4 text-center">
                                         <img id="profileImgPreview" class="rounded-start mw-100 mx-auto" alt="프로필 미리보기" />

                                    <div class="col-md-8">
                                        <div class="card-body">
                                            <div id="profileImgActions" class="d-flex gap-1">
                                                <button type="button" id="profileImgEditBtn" class="btn btn-sm btn-outline-secondary">수정</button>

                            <input type="text" class="form-control" id="headline" placeholder="예) 중고등 수학 10년 경력" required>

                        </div>
                         <div class="mb-4">
                            <h5 class="fw-bold">5. 강의 스타일</h5>
                            <textarea class="form-control" id="selfIntro" rows="5" placeholder="자기소개서를 입력하세요&#10;&#10;- 교육 철학&#10;- 강점&#10;- 학생들에게 제공할 수 있는 가치"></textarea>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">6. 동영상 소개</h5>
                            <label class="form-label">소개 영상 유튜브 URL</label>
                            <input type="url" class="form-control mb-2" id="videoUrl" placeholder="https://">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">다음 단계로</button>
                    </form>
                </div>
            </div>
        </div>

        <script>
            // 엘리먼트 변수 모음
            const EL = {
                profileImg: document.getElementById('profileImg'),
                profileImgPreview: document.getElementById('profileImgPreview'),
                profileImgCard: document.getElementById('profileImgCard'),
                profileImgEditBtn: document.getElementById('profileImgEditBtn'),
                profileImgDeleteBtn: document.getElementById('profileImgDeleteBtn'),

                basicName: document.getElementById('basicName'),
                basicPhone: document.getElementById('basicPhone'),
                headline: document.getElementById('headline'),
                bio: document.getElementById('bio'),
                selfIntro: document.getElementById('selfIntro'),
                videoUrl: document.getElementById('videoUrl'),

                tutorProfileForm: document.getElementById('tutorProfileForm')
            };

            function getMemoryAccessToken() {
                return typeof getAccessToken === 'function' ? getAccessToken() : null;
            }

            function setMemoryAccessToken(token) {
                if (typeof setAccessToken === 'function') {
                    setAccessToken(token);
                }
            }

            function buildAuthHeaders() {
                const accessToken = getMemoryAccessToken();
                return accessToken ? { Authorization: `Bearer ${accessToken}` } : {};
            }

            async function fetchMe() {
                let response = await fetch('/api/users/me', {
                    headers: buildAuthHeaders()
                });
                if (response.ok) {
                    const data = await response.json();
                    return data && data.success ? data.data : null;
                }

                const refreshResponse = await fetch('/api/auth/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                if (!refreshResponse.ok) {
                    return null;
                }
                const refreshData = await refreshResponse.json();
                if (refreshData && refreshData.success && refreshData.data && refreshData.data.accessToken) {
                    setMemoryAccessToken(refreshData.data.accessToken);
                }

                response = await fetch('/api/users/me', {
                    headers: buildAuthHeaders()
                });
                if (!response.ok) {
                    return null;
                }
                const data = await response.json();
                return data && data.success ? data.data : null;
            }

            function isTutor(authList) {
                if (!Array.isArray(authList)) {
                    return false;
                }
                return authList.some((a) =>
                    a.auth === 'ROLE_TUTOR' ||
                    a.auth === 'ROLE_TUTOR_PENDING' ||
                    a === 'ROLE_TUTOR' ||
                    a === 'ROLE_TUTOR_PENDING'
                );
            }

            function fileToBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
            }

            document.addEventListener('DOMContentLoaded', async () => {
                const me = await fetchMe();
                
                if (!me) {
                    alert('사용자 정보를 가져올 수 없습니다.');
                    location.href = '/';
                    return;
                }

                // 튜터 권한 체크를 완화 (회원가입 진행 중일 수 있으므로)
                // if (!isTutor(me.authList)) {
                //     alert('튜터 권한이 필요합니다.');
                //     location.href = '/';
                //     return;
                // }

                // 이전에 저장된 데이터 불러오기
                const savedData = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                if (savedData.basicName) document.getElementById('basicName').value = savedData.basicName;
                if (savedData.basicPhone) document.getElementById('basicPhone').value = savedData.basicPhone;
                if (savedData.headline) document.getElementById('headline').value = savedData.headline;
                if (savedData.bio) document.getElementById('bio').value = savedData.bio;
                if (savedData.videoUrl) document.getElementById('videoUrl').value = savedData.videoUrl;
            });

            document.getElementById('tutorProfileForm').addEventListener('submit', async (event) => {
                event.preventDefault();

                // 1단계 데이터 저장
                const step1Data = {
                    basicName: document.getElementById('basicName').value,
                    basicPhone: document.getElementById('basicPhone').value,
                    headline: document.getElementById('headline').value,
                    bio: document.getElementById('bio').value,
                    videoUrl: document.getElementById('videoUrl').value
                };

                sessionStorage.setItem('tutorRegisterStep1', JSON.stringify(step1Data));

                // 파일 처리는 추후 구현 예정
                // const profileImage = document.getElementById('profileImage').files[0];
                // const introVideoFile = document.getElementById('introVideoFile').files[0];

                // 다음 단계로 이동

                const savedData = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                if (savedData.basicName) {
                    EL.basicName.value = savedData.basicName;
                } else if (me.name) {
                    EL.basicName.value = me.name;
                }
                if (savedData.basicPhone) EL.basicPhone.value = savedData.basicPhone;
                if (savedData.headline) EL.headline.value = savedData.headline;
                if (savedData.bio) EL.bio.value = savedData.bio;
                if (savedData.selfIntro) EL.selfIntro.value = savedData.selfIntro;
                if (savedData.videoUrl) EL.videoUrl.value = savedData.videoUrl;

                if (savedData.profileImg) {
                    EL.profileImgPreview.src = savedData.profileImg;
                    EL.profileImgCard.style.display = 'block';
                } else {
                    EL.profileImgCard.style.display = 'none';
                }
            });

            EL.profileImg.addEventListener('change', async (event) => {
                const file = event.target.files[0];
                if (!file) return;
                try {
                    const base64 = await fileToBase64(file);
                    EL.profileImgPreview.src = base64;
                    EL.profileImgCard.style.display = 'block';
                    const saved = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                    saved.profileImg = base64;
                    sessionStorage.setItem('tutorRegisterStep1', JSON.stringify(saved));
                } catch (e) {
                    console.error('이미지 처리 실패', e);
                }
            });

            EL.profileImgEditBtn.addEventListener('click', () => {
                EL.profileImg.click();
            });

            EL.profileImgDeleteBtn.addEventListener('click', () => {
                EL.profileImgCard.style.display = 'none';
                EL.profileImg.value = null;
                const saved = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                if (saved.profileImg) delete saved.profileImg;
                sessionStorage.setItem('tutorRegisterStep1', JSON.stringify(saved));
            });

            EL.tutorProfileForm.addEventListener('submit', async (event) => {
                event.preventDefault();

                const basicName = EL.basicName.value.trim();
                const basicPhone = EL.basicPhone.value.trim();
                const headline = EL.headline.value.trim();
                const bio = EL.bio.value.trim();
                const selfIntro = EL.selfIntro.value.trim();
                const videoUrl = EL.videoUrl.value.trim();

                if (!basicName || !basicPhone || !headline || !bio || !selfIntro) {
                    alert('필수 항목을 모두 입력해주세요.');
                    return;
                }

                const step1Data = {
                    basicName: basicName,
                    basicPhone: basicPhone,
                    headline: headline,
                    bio: bio,
                    selfIntro: selfIntro,
                    videoUrl: videoUrl
                };

                const profileImgFile = EL.profileImg.files[0];                

                try {
                    if (profileImgFile) {
                        step1Data.profileImg = await fileToBase64(profileImgFile);
                    }
                } catch (error) {
                    console.error('파일 처리 중 오류:', error);
                    alert('파일 처리 중 오류가 발생했습니다.');
                    return;
                }

                const existing = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                if (!step1Data.profileImg && existing.profileImg) {
                    step1Data.profileImg = existing.profileImg;
                }

                sessionStorage.setItem('tutorRegisterStep1', JSON.stringify(step1Data));
                window.location.href = '/tutor/register1';
            });
        </script>
    </div>
</div>
