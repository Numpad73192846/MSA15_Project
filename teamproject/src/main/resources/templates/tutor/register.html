<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main_layout}">

    <div layout:fragment="content">
        <div class="container py-5" style="max-width: 720px;">
            <div class="mb-4 text-center">
                <h2 class="h4 fw-bold">튜터 회원가입 (1/4단계)</h2>
                <p class="text-muted mb-0">기본 정보를 입력해 주세요.</p>
            </div>

            <div class="progress mb-4" style="height: 8px;">
                <div class="progress-bar" role="progressbar" style="width: 25%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form id="tutorProfileForm">
                        <div class="mb-4">
                            <h5 class="fw-bold">1. 기본 정보</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">이름</label>
                                    <input type="text" class="form-control" id="basicName" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">연락처</label>
                                    <input type="text" class="form-control" id="basicPhone" placeholder="010-0000-0000" required>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">2. 사진</h5>
                            <input type="file" class="form-control" id="profileImage" accept="image/*">
                            <div id="profileImageCard" class="card my-2" style="display:none;">
                                <div class="row g-0 align-items-center">
                                    <div class="col-md-4 text-center">
                                         <img id="profileImagePreview" class="rounded-start mw-100 mx-auto" alt="프로필 미리보기" />
                                    </div>
                                    <div class="col-md-8">
                                        <div class="card-body">
                                            <div id="profileImageActions" class="d-flex gap-1">
                                                <button type="button" id="profileImageEditBtn" class="btn btn-sm btn-outline-secondary">수정</button>
                                                <button type="button" id="profileImageDeleteBtn" class="btn btn-sm btn-outline-danger">삭제</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">3. 한 줄 소개</h5>
                            <input type="text" class="form-control" id="headline" placeholder="예) 중고등 수학 10년 경력" required>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">4. 소개</h5>
                            <textarea class="form-control" id="bio" rows="5" placeholder="튜터 소개를 입력하세요" required></textarea>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">5. 동영상 소개</h5>
                            <label class="form-label">소개 영상 URL</label>
                            <input type="url" class="form-control mb-2" id="videoUrl" placeholder="https://">
                            <small class="text-muted">또는 파일 업로드</small>
                            <input type="file" class="form-control mt-2" id="introVideoFile" accept="video/*">
                            <div id="videoFileCard" class="card mt-2 overflow-hidden" style="display:none;">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item py-2 d-flex align-items-start align-items-center gap-2">
                                        <div id="videoFileInfo" class="col text-break">
                                            <span id="videoFileName"></span>
                                            <small id="videoFileSize"></small>
                                        </div>
                                        <div class="d-flex gap-1" id="videoFileActions">
                                            <button type="button" id="videoFileEditBtn" class="btn btn-sm btn-outline-secondary">수정</button>
                                            <button type="button" id="videoFileDeleteBtn" class="btn btn-sm btn-outline-danger">삭제</button>
                                        </div>
                                    </li>
                                    
                                </ul>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">다음 단계로</button>
                    </form>
                </div>
            </div>
        </div>

        <script>
            // 엘리먼트 변수 모음
            const EL = {
                profileImage: document.getElementById('profileImage'),
                profileImagePreview: document.getElementById('profileImagePreview'),
                profileImageCard: document.getElementById('profileImageCard'),
                profileImageEditBtn: document.getElementById('profileImageEditBtn'),
                profileImageDeleteBtn: document.getElementById('profileImageDeleteBtn'),
                basicName: document.getElementById('basicName'),
                basicPhone: document.getElementById('basicPhone'),
                headline: document.getElementById('headline'),
                bio: document.getElementById('bio'),
                videoUrl: document.getElementById('videoUrl'),
                introVideoFile: document.getElementById('introVideoFile'),
                videoFileName: document.getElementById('videoFileName'),
                videoFileSize: document.getElementById('videoFileSize'),
                videoFileCard: document.getElementById('videoFileCard'),
                videoFileEditBtn: document.getElementById('videoFileEditBtn'),
                videoFileDeleteBtn: document.getElementById('videoFileDeleteBtn'),
                tutorProfileForm: document.getElementById('tutorProfileForm')
            };

            function getMemoryAccessToken() {
                return typeof getAccessToken === 'function' ? getAccessToken() : null;
            }

            function setMemoryAccessToken(token) {
                if (typeof setAccessToken === 'function') {
                    setAccessToken(token);
                }
            }

            function buildAuthHeaders() {
                const accessToken = getMemoryAccessToken();
                return accessToken ? { Authorization: `Bearer ${accessToken}` } : {};
            }

            async function fetchMe() {
                let response = await fetch('/api/users/me', {
                    headers: buildAuthHeaders()
                });
                if (response.ok) {
                    const data = await response.json();
                    return data && data.success ? data.data : null;
                }

                const refreshResponse = await fetch('/api/auth/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                if (!refreshResponse.ok) {
                    return null;
                }
                const refreshData = await refreshResponse.json();
                if (refreshData && refreshData.success && refreshData.data && refreshData.data.accessToken) {
                    setMemoryAccessToken(refreshData.data.accessToken);
                }

                response = await fetch('/api/users/me', {
                    headers: buildAuthHeaders()
                });
                if (!response.ok) {
                    return null;
                }
                const data = await response.json();
                return data && data.success ? data.data : null;
            }

            function isTutor(authList) {
                if (!Array.isArray(authList)) {
                    return false;
                }
                return authList.some((a) =>
                    a.auth === 'ROLE_TUTOR' ||
                    a.auth === 'ROLE_TUTOR_PENDING' ||
                    a === 'ROLE_TUTOR' ||
                    a === 'ROLE_TUTOR_PENDING'
                );
            }

            function fileToBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
            }

            document.addEventListener('DOMContentLoaded', async () => {
                const me = await fetchMe();
                
                if (!me) {
                    alert('사용자 정보를 가져올 수 없습니다.');
                    location.href = '/';
                    return;
                }

                const savedData = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                if (savedData.basicName) {
                    EL.basicName.value = savedData.basicName;
                } else if (me.name) {
                    EL.basicName.value = me.name;
                }
                if (savedData.basicPhone) EL.basicPhone.value = savedData.basicPhone;
                if (savedData.headline) EL.headline.value = savedData.headline;
                if (savedData.bio) EL.bio.value = savedData.bio;
                if (savedData.videoUrl) EL.videoUrl.value = savedData.videoUrl;

                if (savedData.profileImage) {
                    EL.profileImagePreview.src = savedData.profileImage;
                    EL.profileImageCard.style.display = 'block';
                } else {
                    EL.profileImageCard.style.display = 'none';
                }

                if (savedData.introVideoFileName) {
                    EL.videoFileCard.style.display = 'block';
                    EL.videoFileName.textContent = savedData.introVideoFileName;
                    EL.videoFileSize.textContent = '(' + (savedData.introVideoFileSize || '') + ')';
                } else {
                    EL.videoFileCard.style.display = 'none';
                }
            });

            EL.profileImage.addEventListener('change', async (event) => {
                const file = event.target.files[0];
                if (!file) return;
                try {
                    const base64 = await fileToBase64(file);
                    EL.profileImagePreview.src = base64;
                    EL.profileImageCard.style.display = 'block';
                    const saved = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                    saved.profileImage = base64;
                    sessionStorage.setItem('tutorRegisterStep1', JSON.stringify(saved));
                } catch (e) {
                    console.error('이미지 처리 실패', e);
                }
            });

            EL.profileImageEditBtn.addEventListener('click', () => {
                EL.profileImage.click();
            });

            EL.profileImageDeleteBtn.addEventListener('click', () => {
                EL.profileImageCard.style.display = 'none';
                EL.profileImage.value = null;
                const saved = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                if (saved.profileImage) delete saved.profileImage;
                sessionStorage.setItem('tutorRegisterStep1', JSON.stringify(saved));
            });

            EL.introVideoFile.addEventListener('change', async (event) => {
                const file = event.target.files[0];
                if (!file) return;
                try {
                    const base64 = await fileToBase64(file);
                    EL.videoFileName.textContent = file.name;
                    EL.videoFileSize.textContent = '(' + formatFileSize(file.size) + ')';
                    EL.videoFileCard.style.display = 'block';
                    const saved = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                    saved.introVideoFileName = file.name;
                    saved.introVideoFileSize = formatFileSize(file.size);
                    saved.introVideo = base64;
                    sessionStorage.setItem('tutorRegisterStep1', JSON.stringify(saved));
                } catch (e) {
                    console.error('비디오 파일 처리 실패', e);
                }
            });

            EL.videoFileEditBtn.addEventListener('click', () => {
                EL.introVideoFile.click();
            });

            EL.videoFileDeleteBtn.addEventListener('click', () => {
                EL.videoFileCard.style.display = 'none';
                EL.introVideoFile.value = null;
                EL.videoFileName.textContent = '';
                EL.videoFileSize.textContent = '';
                const saved = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                if (saved.introVideo) delete saved.introVideo;
                if (saved.introVideoFileName) delete saved.introVideoFileName;
                if (saved.introVideoFileSize) delete saved.introVideoFileSize;
                sessionStorage.setItem('tutorRegisterStep1', JSON.stringify(saved));
            });

            EL.tutorProfileForm.addEventListener('submit', async (event) => {
                event.preventDefault();

                const basicName = EL.basicName.value.trim();
                const basicPhone = EL.basicPhone.value.trim();
                const headline = EL.headline.value.trim();
                const bio = EL.bio.value.trim();

                if (!basicName || !basicPhone || !headline || !bio) {
                    alert('필수 항목을 모두 입력해주세요.');
                    return;
                }

                const step1Data = {
                    basicName: basicName,
                    basicPhone: basicPhone,
                    headline: headline,
                    bio: bio,
                    videoUrl: EL.videoUrl.value.trim()
                };

                const profileImageFile = EL.profileImage.files[0];
                const introVideoFile = EL.introVideoFile.files[0];

                try {
                    if (profileImageFile) {
                        step1Data.profileImage = await fileToBase64(profileImageFile);
                    }
                    if (introVideoFile) {
                        step1Data.introVideo = await fileToBase64(introVideoFile);
                        step1Data.introVideoFileName = introVideoFile.name;
                        step1Data.introVideoFileSize = formatFileSize(introVideoFile.size);
                    }
                } catch (error) {
                    console.error('파일 처리 중 오류:', error);
                    alert('파일 처리 중 오류가 발생했습니다.');
                    return;
                }

                const existing = JSON.parse(sessionStorage.getItem('tutorRegisterStep1') || '{}');
                if (!step1Data.profileImage && existing.profileImage) {
                    step1Data.profileImage = existing.profileImage;
                }
                if (!step1Data.introVideo && existing.introVideo) {
                    step1Data.introVideo = existing.introVideo;
                    step1Data.introVideoFileName = existing.introVideoFileName;
                    step1Data.introVideoFileSize = existing.introVideoFileSize;
                }

                sessionStorage.setItem('tutorRegisterStep1', JSON.stringify(step1Data));
                window.location.href = '/tutor/register1';
            });
        </script>
    </div>
</div>
