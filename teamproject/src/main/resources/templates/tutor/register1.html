
<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main_layout}">

    <th:block layout:fragment="extra-css">
        <link rel="stylesheet" href="/css/tutor-register-admin.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <style>
            #careerCardList:empty {
                display: none;
            }
        </style>
    </th:block>
    <th:block layout:fragment="title">
        <title>튜터 회원가입 (2/4) | 튜터 플랫폼</title>
    </th:block>

    <div layout:fragment="content">
        <div class="container py-5" style="max-width: 720px;">
            <div class="mb-4 text-center">
                <h2 class="h4 fw-bold">튜터 회원가입 (2/4단계)</h2>
                <p class="text-muted mb-0">학력 및 경력 정보를 입력해 주세요.</p>
            </div>

            <div class="progress mb-4" style="height: 8px;">
                <div class="progress-bar" role="progressbar" style="width: 50%;" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form id="tutorProfileForm">
                        <div class="mb-4">
                            <h5 class="fw-bold">1. 학력증명서</h5>
                            <div class="border rounded-3 p-3 bg-light">
                                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
                                    <div>
                                        <div class="fw-semibold">파일 업로드</div>
                                        <div class="small text-muted">PDF, JPG, PNG 가능 · 여러 파일 선택 가능</div>
                                    </div>
                                    <label class="btn btn-outline-primary btn-sm mb-0">
                                        파일 선택
                                        <input type="file" class="d-none" id="academicCertificate" multiple accept=".pdf,.jpg,.jpeg,.png">
                                    </label>
                                </div>
                                <div id="academicListCard" class="card mt-3 overflow-hidden filelist-card" style="display:none;">
                                    <ul id="academicList" class="list-group list-group-flush"></ul>
                                    <div class="file-item-template" style="display: none;">
                                        <li class="list-group-item py-2 d-flex align-items-center gap-2">
                                            <div class="col text-break">
                                                <span class="file-name"></span>
                                                <small class="file-size"></small>
                                            </div>
                                            <div class="d-flex align-items-center gap-1">
                                                <button type="button" class="btn btn-sm btn-outline-secondary edit-btn">수정</button>
                                                <button type="button" class="btn btn-sm btn-outline-danger delete-btn">삭제</button>
                                            </div>
                                        </li>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <h5 class="fw-bold">2. 교육 관련 학위 및 증명서</h5>
                            <div class="admin-box">
                                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
                                    <div>
                                        <div class="fw-semibold">파일 업로드</div>
                                        <div class="small text-muted">자격증, 수료증 등 업로드</div>
                                    </div>
                                    <label class="btn btn-outline-primary btn-sm mb-0">
                                        파일 선택
                                        <input type="file" class="d-none" id="educationCertificate" multiple accept=".pdf,.jpg,.jpeg,.png">
                                    </label>
                                </div>
                                <div id="educationListCard" class="card mt-3 overflow-hidden filelist-card" style="display:none;">
                                    <ul id="educationList" class="list-group list-group-flush"></ul>
                                    <div class="file-item-template" style="display: none;">
                                        <li class="list-group-item py-2 d-flex align-items-center gap-2">
                                            <div class="col text-break">
                                                <span class="file-name" style="font-weight: 500;"></span>
                                                <small class="file-size" style="color: #666;"></small>
                                            </div>
                                            <div class="d-flex align-items-center gap-1">
                                                <button type="button" class="btn btn-sm btn-outline-secondary edit-btn">수정</button>
                                                <button type="button" class="btn btn-sm btn-outline-danger delete-btn">삭제</button>
                                            </div>
                                        </li>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="d-flex align-items-center justify-content-between mb-2">
                                <h5 class="fw-bold mb-0">3. 근무 경력</h5>
                                <span class="badge text-bg-light border">선택 항목</span>
                            </div>
                            <p class="text-muted small mb-2">최근 경력부터 추가해 주세요. 퇴사연도는 재직 중이면 비워두세요.</p>
                            <div class="card border rounded-3 p-3 bg-light">
                                <div class="row g-2">
                                    <div class="col-md-6">
                                        <label class="form-label small text-muted">회사명</label>
                                        <input type="text" class="form-control" id="careerCompany" placeholder="예) ABC학원">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small text-muted">직종</label>
                                        <input type="text" class="form-control" id="careerJob" placeholder="예) 영어강사">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small text-muted">직위</label>
                                        <input type="text" class="form-control" id="careerPosition" placeholder="예) 팀장">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small text-muted">입사연도</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="careerStartYear" min="1950" max="2100" placeholder="2020">
                                            <span class="input-group-text">년</span>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small text-muted">퇴사연도 (선택)</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="careerEndYear" min="1950" max="2100" placeholder="2023">
                                            <span class="input-group-text">년</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-end mt-3">
                                    <button type="button" class="btn btn-outline-primary" id="btnAddCareer">경력 추가</button>
                                </div>
                                <div class="d-flex flex-wrap gap-2" id="careerCardList"></div>
                            </div>
                        </div>
                        <div class="d-flex gap-2 step-nav">
                            <button type="button" class="btn btn-secondary" style="height: 45px; line-height: 1; display: flex; align-items: center; justify-content: center;" onclick="history.back()">이전</button>
                            <button type="submit" class="btn btn-primary flex-fill" style="height: 45px; line-height: 1; display: flex; align-items: center; justify-content: center;">다음 단계로</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <th:block layout:fragment="extra-scripts">
        <script>
            function getStoredTokens() {
                return {
                    accessToken: localStorage.getItem('accessToken'),
                    refreshToken: localStorage.getItem('refreshToken')
                };
            }

            async function fetchMe(accessToken) {
                let response = await fetch('/api/users/me', {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    return data && data.success ? data.data : null;
                }

                // 토큰 갱신
                const refreshToken = localStorage.getItem('refreshToken');
                const refreshResponse = await fetch('/api/auth/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refreshToken: refreshToken })
                });
                if (!refreshResponse.ok) {
                    return null;
                }
                const refreshData = await refreshResponse.json();
                if (refreshData && refreshData.success && refreshData.data && refreshData.data.accessToken) {
                    const newAccessToken = refreshData.data.accessToken;
                    localStorage.setItem('accessToken', newAccessToken);
                    if (refreshData.data.refreshToken) {
                        localStorage.setItem('refreshToken', refreshData.data.refreshToken);
                    }
                    // 갱신된 토큰으로 다시 시도
                    response = await fetch('/api/users/me', {
                        headers: { Authorization: `Bearer ${newAccessToken}` }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        return data && data.success ? data.data : null;
                    }
                }
                return null;
            }

            function isTutor(authList) {
                if (!Array.isArray(authList)) {
                    return false;
                }
                return authList.some((a) =>
                    a.auth === 'ROLE_TUTOR' ||
                    a.auth === 'ROLE_TUTOR_PENDING' ||
                    a === 'ROLE_TUTOR' ||
                    a === 'ROLE_TUTOR_PENDING'
                );
            }

            // 파일을 base64로 변환하는 함수
            function fileToBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            // 파일 용량을 읽기 좋은 형식으로 변환
            function formatFileSize(bytes) {
                if (!bytes && bytes !== 0) return '';
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
            }

            // 여러 파일을 {name,size,data} 객체 배열로 변환
            async function filesToObjectArray(files) {
                const results = [];
                for (let file of files) {
                    const data = await fileToBase64(file);
                    results.push({ name: file.name, size: file.size, data });
                }
                return results;
            }

            // 지정 컨테이너에 파일 리스트 렌더링 (files = [{name,size,data}, ...])
            function renderFileList(containerId, cardId, files, inputId, storageKey) {
                const container = document.getElementById(containerId);
                const card = document.getElementById(cardId);
                if (!container || !card) return;

                // 기존 파일 항목 제거
                const fileItems = container.querySelectorAll('li');
                fileItems.forEach(item => item.remove());

                // 파일이 없으면 카드 숨기기
                if (!files || files.length === 0) {
                    card.style.display = 'none';
                    return;
                }

                // 파일이 있으면 카드 표시
                card.style.display = 'block';

                // 템플릿 가져오기 (li 태그만)
                const template = card.querySelector('.file-item-template li');
                if (!template) return;

                files.forEach((f, idx) => {
                    const clone = template.cloneNode(true);

                    const fileNameSpan = clone.querySelector('.file-name');
                    const fileSizeSpan = clone.querySelector('.file-size');
                    const editBtn = clone.querySelector('.edit-btn');
                    const deleteBtn = clone.querySelector('.delete-btn');

                    if (fileNameSpan) fileNameSpan.textContent = f.name;
                    if (fileSizeSpan) fileSizeSpan.textContent = '(' + formatFileSize(f.size) + ')';

                    if (editBtn) {
                        editBtn.addEventListener('click', () => {
                            const input = document.getElementById(inputId);
                            if (input) {
                                input.dataset.replaceIndex = idx;
                                input.click();
                            }
                        });
                    }

                    if (deleteBtn) {
                        deleteBtn.addEventListener('click', () => {
                            const saved = JSON.parse(sessionStorage.getItem('tutorRegisterStep2') || '{}');
                            const arr = saved[storageKey] || [];
                            arr.splice(idx, 1);
                            saved[storageKey] = arr;
                            sessionStorage.setItem('tutorRegisterStep2', JSON.stringify(saved));
                            renderFileList(containerId, cardId, arr, inputId, storageKey);
                        });
                    }

                    container.appendChild(clone);
                });
            }

            // 파일 선택 처리: 새 파일 추가 또는 특정 인덱스 교체
            async function handleFilesSelected(inputElem, storageKey, containerId, cardId) {
                const files = inputElem.files;
                if (!files || files.length === 0) return;
                const saved = JSON.parse(sessionStorage.getItem('tutorRegisterStep2') || '{}');
                const existing = saved[storageKey] || [];

                const objs = await filesToObjectArray(files);

                if (inputElem.dataset.replaceIndex) {
                    const idx = parseInt(inputElem.dataset.replaceIndex, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < existing.length) {
                        existing.splice(idx, 1, objs[0]);
                    } else {
                        // index invalid -> append
                        existing.push(...objs);
                    }
                    delete inputElem.dataset.replaceIndex;
                } else {
                    existing.push(...objs);
                }

                saved[storageKey] = existing;
                sessionStorage.setItem('tutorRegisterStep2', JSON.stringify(saved));
                renderFileList(containerId, cardId, existing, inputElem.id, storageKey);
                // clear input to allow same-file reselect
                inputElem.value = null;
            }

            function renderCareerCards(careers) {
                const list = document.getElementById('careerCardList');
                if (!list) return;
                list.innerHTML = '';

                careers.forEach((careerItem, index) => {
                    const endLabel = careerItem.endYear ? careerItem.endYear : '재직중';
                    const badge = document.createElement('div');
                    badge.className = 'mt-3 admin-chip';
                    badge.innerHTML = `
                        <span class="label">${careerItem.companyName}</span>
                        <span class="sub">${careerItem.jobCategory} · ${careerItem.jobRole} · ${careerItem.startYear}~${endLabel}</span>
                        <button type="button" class="icon-btn danger" aria-label="삭제"><i class="bi bi-x"></i></button>
                    `;
                    badge.querySelector('button').addEventListener('click', () => {
                        careers.splice(index, 1);
                        const saved = JSON.parse(sessionStorage.getItem('tutorRegisterStep2') || '{}');
                        saved.careers = careers;
                        sessionStorage.setItem('tutorRegisterStep2', JSON.stringify(saved));
                        renderCareerCards(careers);
                    });
                    list.appendChild(badge);
                });
            }

            document.addEventListener('DOMContentLoaded', async () => {
                // 이전에 저장된 데이터 불러오기
                const savedData = JSON.parse(sessionStorage.getItem('tutorRegisterStep2') || '{}');
                if (Array.isArray(savedData.careers)) {
                    renderCareerCards(savedData.careers);
                }
                // 파일 리스트 복원
                if (savedData.academicCertificates && Array.isArray(savedData.academicCertificates)) {
                    renderFileList('academicList', 'academicListCard', savedData.academicCertificates, 'academicCertificate', 'academicCertificates');
                }
                if (savedData.educationCertificates && Array.isArray(savedData.educationCertificates)) {
                    renderFileList('educationList', 'educationListCard', savedData.educationCertificates, 'educationCertificate', 'educationCertificates');
                }

                // 파일 input 변경 이벤트 연결
                document.getElementById('academicCertificate').addEventListener('change', function () {
                    handleFilesSelected(this, 'academicCertificates', 'academicList', 'academicListCard');
                });
                document.getElementById('educationCertificate').addEventListener('change', function () {
                    handleFilesSelected(this, 'educationCertificates', 'educationList', 'educationListCard');
                });

                document.getElementById('btnAddCareer')?.addEventListener('click', () => {
                    const companyName = document.getElementById('careerCompany').value.trim();
                    const jobCategory = document.getElementById('careerJob').value.trim();
                    const jobRole = document.getElementById('careerPosition').value.trim();
                    const startYear = document.getElementById('careerStartYear').value.trim();
                    const endYear = document.getElementById('careerEndYear').value.trim();

                    if (!companyName || !jobCategory || !jobRole || !startYear) {
                        alert('회사명, 직종, 직위, 입사연도를 입력해주세요.');
                        return;
                    }

                    const saved = JSON.parse(sessionStorage.getItem('tutorRegisterStep2') || '{}');
                    const careers = Array.isArray(saved.careers) ? saved.careers : [];
                    careers.push({ companyName, jobCategory, jobRole, startYear, endYear });
                    saved.careers = careers;
                    sessionStorage.setItem('tutorRegisterStep2', JSON.stringify(saved));
                    renderCareerCards(careers);

                    document.getElementById('careerCompany').value = '';
                    document.getElementById('careerJob').value = '';
                    document.getElementById('careerPosition').value = '';
                    document.getElementById('careerStartYear').value = '';
                    document.getElementById('careerEndYear').value = '';
                });
            });

            document.getElementById('tutorProfileForm').addEventListener('submit', async (event) => {
                event.preventDefault();

                // 필수 필드 검증
                // 2단계 데이터 저장
                const existing = JSON.parse(sessionStorage.getItem('tutorRegisterStep2') || '{}');
                const step2Data = {
                    careers: Array.isArray(existing.careers) ? existing.careers : []
                };

                // 파일 처리
                const academicCertificateFiles = document.getElementById('academicCertificate').files;
                const educationCertificateFiles = document.getElementById('educationCertificate').files;

                try {
                    if (academicCertificateFiles.length > 0) {
                        step2Data.academicCertificates = await filesToObjectArray(academicCertificateFiles);
                    }
                    if (educationCertificateFiles.length > 0) {
                        step2Data.educationCertificates = await filesToObjectArray(educationCertificateFiles);
                    }
                } catch (error) {
                    console.error('파일 처리 중 오류:', error);
                    alert('파일 처리 중 오류가 발생했습니다.');
                    return;
                }

                // 이전에 저장된 파일 정보가 있고 새로 업로드하지 않았다면 보존
                if (!step2Data.academicCertificates && existing.academicCertificates) {
                    step2Data.academicCertificates = existing.academicCertificates;
                }
                if (!step2Data.educationCertificates && existing.educationCertificates) {
                    step2Data.educationCertificates = existing.educationCertificates;
                }

                sessionStorage.setItem('tutorRegisterStep2', JSON.stringify(step2Data));

                // 다음 단계로 이동
                location.href = '/tutor/register2';
            });
        </script>
        </th:block>
    </div>
</div>
