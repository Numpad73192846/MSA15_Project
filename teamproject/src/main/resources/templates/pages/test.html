<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 목록 테스트</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>사용자 목록 테스트</h1>
        <button id="loadUsersBtn" class="btn btn-primary">사용자 목록 불러오기</button>
        <div id="userList" class="mt-3">
            <!-- 사용자 목록이 여기에 표시됩니다 -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loadUsersBtn').addEventListener('click', function() {
            fetch('/pages')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('네트워크 응답 오류: ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    displayUsers(data);
                })
                .catch(error => {
                    console.error('오류 발생:', error);
                    document.getElementById('userList').innerHTML = '<div class="alert alert-danger">사용자 목록을 불러오는 중 오류가 발생했습니다: ' + error.message + '</div>';
                });
        });

        function displayUsers(users) {
            if (!Array.isArray(users) || users.length === 0) {
                document.getElementById('userList').innerHTML = '<div class="alert alert-info">사용자가 없습니다.</div>';
                return;
            }

            let html = '<table class="table table-striped"><thead><tr><th>번호</th><th>사용자명</th><th>이름</th><th>닉네임</th><th>상태</th><th>생성일</th></tr></thead><tbody>';
            users.forEach(user => {
                html += `<tr>
                    <td>${user.no || ''}</td>
                    <td>${user.username || ''}</td>
                    <td>${user.name || ''}</td>
                    <td>${user.nickname || ''}</td>
                    <td>${user.status || ''}</td>
                    <td>${user.createdAt ? new Date(user.createdAt).toLocaleString('ko-KR') : ''}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('userList').innerHTML = html;
        }
    </script>
</body>
</html>
