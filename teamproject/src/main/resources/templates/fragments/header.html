<th:block th:fragment="header">
    <header class="navbar">
        <div class="navbar-container">
            <a class="navbar-logo" href="/">
                <img src="/img/logo.png" alt="투코스 로고" style="height: 36px;">
            </a>

            <!-- 중앙 네비게이션 (데스크탑) -->
            <nav class="d-none d-md-flex gap-4">
                <a href="/" class="text-decoration-none text-secondary fw-semibold">홈</a>
                <a href="/tutors" class="text-decoration-none text-secondary fw-semibold">튜터 찾기</a>
            </nav>

            <!-- 오른쪽 버튼 영역 -->
            <div class="navbar-right">
                <!-- 로그인 전 -->
                <div id="navAuthArea" class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-secondary rounded-pill px-3"
                        onclick="location.href='/login'">로그인</button>
                    <button class="btn btn-sm btn-primary rounded-pill px-3"
                        onclick="location.href='/login'">회원가입</button>
                </div>

                <!-- 로그인 후 (스크립트로 제어되지만, 기본 구조 개선) -->
                <button class="btn btn-sm btn-outline-primary rounded-pill px-3" id="navMyPageBtn"
                    style="display: none;">
                    마이페이지
                </button>
                <button class="btn btn-sm btn-danger rounded-pill px-3" id="navLogoutBtn" style="display: none;"
                    onclick="location.href='/login'">
                    로그아웃
                </button>
            </div>
        </div>
    </header>
</th:block>
