<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: headFragment}"></th:block>
    <title>Tutoring-go - 튜터 가입</title>
</head>
<body class="bg-gray-50 font-['GmarketSansMedium']">

    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <main class="max-w-4xl mx-auto py-12 px-6">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 md:p-12">
            <div class="mb-10 text-center">
                <h2 class="text-3xl font-bold text-gray-900">튜터 가입 신청</h2>
                <p class="text-gray-500 mt-2">당신도 온라인 명강사가 될 수 있습니다! 정보를 입력해 주세요.</p>
            </div>

            <form th:action="@{/auth/join_tutor}" method="post" enctype="multipart/form-data">
                <!-- 1. 프로필 섹션 -->
                <div class="mb-12">
                    <h3 class="text-xl font-bold border-b border-gray-100 pb-3 mb-6">1. 기본 프로필</h3>
                    
                    <div class="flex flex-col md:flex-row gap-8">
                        <div class="flex-shrink-0 flex flex-col items-center">
                            <div class="w-32 h-32 rounded-full bg-gray-100 border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden mb-3">
                                <span class="text-gray-400 text-xs text-center px-2 font-['GmarketSansLight']">프로필 사진을<br>업로드하세요</span>
                            </div>
                            <input type="file" class="hidden" id="profileImg" name="profileImg">
                            <button type="button" onclick="document.getElementById('profileImg').click()" class="text-xs text-indigo-600 font-bold hover:underline">사진 등록</button>
                        </div>
                        
                        <div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">성명 (실명)</label>
                                <input type="text" name="name" class="w-full border border-gray-200 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-400" placeholder="홍길동">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">국적</label>
                                <select name="nationality" class="w-full border border-gray-200 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-400">
                                    <option value="KR">대한민국</option>
                                    <option value="US">미국</option>
                                    <option value="CN">중국</option>
                                    <option value="JP">일본</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-bold text-gray-700 mb-1">한 줄 자기소개</label>
                                <input type="text" name="headline" class="w-full border border-gray-200 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-400" placeholder="열정적으로 가르치는 5년 차 영어 튜터입니다.">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. 강의 상세 -->
                <div class="mb-12">
                    <h3 class="text-xl font-bold border-b border-gray-100 pb-3 mb-6">2. 강의 전문 분야</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">주요 언어</label>
                            <input type="text" name="languages" class="w-full border border-gray-200 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-400" placeholder="한국어, 영어">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">희망 시간당 급여 ($)</label>
                            <input type="number" name="price" class="w-full border border-gray-200 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-400" placeholder="20">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-gray-700 mb-1">강의 상세 내용</label>
                            <textarea name="intro" rows="5" class="w-full border border-gray-200 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-400" placeholder="자신의 강의 스타일이나 커리큘럼을 자세히 적어주세요."></textarea>
                        </div>
                    </div>
                </div>

                <!-- 3. 경력/학력 -->
                <div class="mb-12">
                    <h3 class="text-xl font-bold border-b border-gray-100 pb-3 mb-6">3. 경력 및 학력</h3>
                    <div class="space-y-4">
                        <textarea name="experience" rows="4" class="w-full border border-gray-200 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-400" placeholder="예: OO대학교 졸업, OO어학원 3년 근무"></textarea>
                    </div>
                </div>

                <!-- 가입 버튼 -->
                <div class="pt-6 border-t border-gray-100">
                    <button type="submit" class="w-full bg-[#FF4D42] text-white py-4 rounded-xl font-bold text-xl hover:bg-red-600 transition shadow-lg shadow-red-200">
                        튜터 지원하기
                    </button>
                    <p class="text-center text-xs text-gray-400 mt-4">
                        등록 시 Tutoring-go의 튜터 이용약관에 동의하게 됩니다.
                    </p>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footerFragment}"></div>

</body>
</html>
