<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main_layout}">

    <div layout:fragment="content">
        <div class="container py-5">
            <div class="text-center mb-4">
                <h2 class="h3 fw-bold mb-1">로그인 / 회원가입</h2>
                <p class="text-muted mb-0">튜터링고에서 학습을 시작하세요</p>
            </div>

            <div class="d-flex justify-content-center gap-2 mb-4">
                <button id="userTypeStudent" class="btn btn-primary">학생으로 시작</button>
                <button id="userTypeTutor" class="btn btn-outline-primary">튜터로 시작</button>
            </div>

            <div class="card shadow-sm mx-auto" style="max-width:520px;">
                <div class="card-body">
                    <ul class="nav nav-tabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link"
                                th:classappend="${activeTab != 'signup'} ? 'active' : ''"
                                data-bs-toggle="tab"
                                data-bs-target="#tabLogin">로그인</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link"
                                th:classappend="${activeTab == 'signup'} ? 'active' : ''"
                                 data-bs-toggle="tab"
                                data-bs-target="#tabSignup">회원가입</button>
                        </li>
                    </ul>

                    <div class="tab-content pt-4">
                        <div class="tab-pane fade"
                            th:classappend="${activeTab != 'signup'} ? 'show active' : ''"
                            id="tabLogin">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label class="form-label">이메일</label>
                                    <input name="email" type="email" class="form-control"
                                        placeholder="example@email.com" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">비밀번호</label>
                                    <input name="password" type="password" class="form-control" placeholder="••••••••"
                                        required>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                        <label class="form-check-label" for="rememberMe">로그인 상태 유지</label>
                                    </div>
                                    <a href="#" class="small">비밀번호 찾기</a>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">로그인</button>
                            </form>
                        </div>

                        <div class="tab-pane fade"
                            th:classappend="${activeTab == 'signup'} ? 'show active' : ''"
                            id="tabSignup">
                            <form th:object="${joinRequest}" id="signupForm" action="/join" method="post" class="needs-validation" onsubmit="return checkSubmit(event)" novalidate>
                                <input type="hidden" name="role" id="role" value="ROLE_USER">
                                <input type="hidden" name="usernameChecked" th:value="${joinRequest.usernameChecked}" />
                                <input type="hidden" name="nicknameChecked" th:value="${joinRequest.nicknameChecked}" />
                                <!-- CSRF TOKEN -->
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <div class="mb-3">
                                    <label for="username" class="form-label">아이디(이메일)</label>
                                    <div class="input-group">
                                        <input type="email" class="form-control" id="username" th:field="*{username}" oninput="setChecked('username', false); clearInlineError('username')" placeholder="example@email.com">                                
                                        <button type="button" class="btn btn-outline-secondary h-100" onclick="checkDuplicate('username')" >중복확인</button>
                                    </div>
                                    <div id="username-error" class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                                    <div id="username-inline-error" class="text-danger small"></div> 
                                </div>  
                                
                                <div class="mb-3">
                                    <label for="nickname" class="form-label">닉네임</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="nickname" th:field="*{nickname}" oninput="setChecked('nickname', false); clearInlineError('nickname')" placeholder="닉네임">
                                        <button type="button" class="btn btn-outline-secondary h-100" onclick="checkDuplicate('nickname')" >중복확인</button>
                                    </div>                    
                                    <div id="nickname-error" class="text-danger small" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></div>
                                    <div id="nickname-inline-error" class="text-danger small"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">이름</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="홍길동">
                                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>  
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">비밀번호</label>                                    
                                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="비밀번호">
                                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">비밀번호 확인</label>
                                    <input type="password" class="form-control" id="passwordCheck" th:field="*{passwordCheck}" placeholder="비밀번호 확인">
                                    <div class="text-danger small" th:if="${#fields.hasErrors('passwordCheck')}" th:errors="*{passwordCheck}"></div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">회원가입</button>
                            </form>
                        </div>
                    </div>

                    <div class="text-muted small mt-3">로그인/회원가입은 서버 사용자 정보를 기준으로 처리됩니다.</div>
                </div>
            </div>
        </div>    
        <script>
            // 💍 CRSF TOKEN
            const csrfToken = "[[${_csrf.token}]]"    

            // hidden 필드 제어
            function setChecked(type, value) {
                document.querySelector(`[name="${type}Checked"]`).value = value;
            }
            function isChecked(type) {
                return document.querySelector(`[name="${type}Checked"]`).value === "true";
            }

            function setInlineError(type, message) {
                const errorEl = document.getElementById(`${type}-inline-error`);
                if (errorEl) {
                    errorEl.textContent = message || "";
                }
            }

            function clearInlineError(type) {
                setInlineError(type, "");
            }

            // 중복검사
            async function checkDuplicate(type) {
                const input = document.getElementById(type);
                const value = input.value;

                const label = document.querySelector(`label[for="${type}"]`);
                const labelText = label ? label.innerText : "";

                try {
                    const response = await fetch(`/check?type=${encodeURIComponent(type)}&value=${encodeURIComponent(value)}`, {
                        method: 'GET'
                        // headers: {
                        //     'X-CSRF-TOKEN': csrfToken
                        // }
                    });

                    console.log(csrfToken);

                    const data = await response.json();        

                    if (!data.ok) {
                        setInlineError(type, data.message || `${labelText} 중복 확인 중 오류가 발생했습니다.`);
                        setChecked(type, false);

                        console.log(type);
                        console.log(value);
                        
                        return false;
                    }

                    if (data.ok) {
                        setInlineError(type, data.message || `사용 가능한 ${labelText}입니다.`);
                        input.classList.add('was-validated');
                        input.classList.remove('needs-validation');

                        setChecked(type, true);   // 통과
                        return true;
                    }

                    setInlineError(type, data.message || `중복된 ${labelText}입니다.`);
                    input.classList.add('needs-validation');
                    input.classList.remove('was-validated');

                    setChecked(type, false);  // 실패
                    return false;
                    
                } catch (error) {
                    console.error('Error:', error);
                    setInlineError(type, `${labelText} 중복 확인 중 오류가 발생했습니다.`);
                    setChecked(type, false);
                    return false;
                }           
            }

            // 제출 확인
            async function checkSubmit(event) {
                event.preventDefault(); // 폼 제출 방지

                if (!isChecked("username")) {
                    setInlineError("username", "아이디 중복 확인을 해주세요");
                    return false;
                }

                if (!isChecked("nickname")) {
                    setInlineError("nickname", "닉네임 중복 확인을 해주세요");
                    return false;
                }
                document.getElementById("signupForm").submit();                
            }
        </script>
    </div>
    <!-- fragment end -->
</div>
