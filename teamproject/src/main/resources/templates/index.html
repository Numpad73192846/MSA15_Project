<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main_layout}">

    <div layout:fragment="content">
        <!-- Hero Section -->
        <section class="hero-section py-5 bg-white">
            <div class="container">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="background: #f8fafc;">
                    <div class="row align-items-center g-0">
                        <!-- Left Content -->
                        <div class="col-lg-6 p-5">
                            <h1 class="display-5 fw-bolder mb-4 text-dark"
                                style="letter-spacing: -0.5px; line-height: 1.3;">
                                원하는 튜터를<br>
                                <span class="text-primary">쉽고 빠르게</span> 찾으세요
                            </h1>
                            <p class="lead mb-4 text-muted" style="font-weight: 400;">
                                검증된 전문 튜터와 함께 1:1 맞춤 학습을 시작하세요.<br>
                                과목, 시간, 가격을 자유롭게 선택할 수 있습니다.
                            </p>
                            <div class="d-flex gap-3">
                                <button class="btn btn-primary btn-lg px-4 rounded-pill shadow-sm"
                                    onclick="location.href='/tutors'">
                                    튜터 찾기
                                </button>
                                <!-- ============================== 수정 (이용안내 버튼 링크 변경) ==============================
                                     작성일: 2026-02-02
                                     수정 내용: href 변경 /about -> /guide (이용안내 페이지 연결)
                                ============================== -->
                                <button class="btn btn-outline-secondary btn-lg px-4 rounded-pill"
                                    onclick="location.href='/guide'">
                                    이용 안내
                                </button>
                                <!-- ============================== 수정 종료 ============================== -->
                            </div>
                        </div>

                        <!-- Right Image -->
                        <div class="col-lg-6">
                            <img src="/img/edu.jpg" alt="Learner" class="img-fluid w-100 h-100 object-fit-cover"
                                style="min-height: 400px; clip-path: polygon(10% 0, 100% 0, 100% 100%, 0% 100%);">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Stats Section -->
        <section class="stats-section py-5" style="background-color: white;">
            <div class="container position-relative z-2">
                <div class="row g-4 justify-content-center">
                    <div class="col-md-4 col-sm-6">
                        <div class="card border border-light-subtle shadow-sm h-100 text-center rounded-4 hover-lift overflow-hidden"
                            style="background: white;">
                            <div class="card-body d-flex flex-column p-0">
                                <div class="stat-icon d-inline-flex align-items-center justify-content-center p-3 bg-indigo-50 text-primary" style="height: 280px; width: 100%;">
                                    <img src="/img/teacher.png" alt="선생님이미지" style="max-width: 240px; max-height: 240px; object-fit: contain;">
                                </div>
                                <div class="mt-auto p-4" style="background-color: #ffffff;">
                                    <h3 class="fw-bold mb-1 display-6">100+</h3>
                                    <p class="text-muted mb-0">검증된 전문 튜터</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 col-sm-6">
                        <div class="card border border-light-subtle shadow-sm h-100 text-center rounded-4 hover-lift overflow-hidden"
                            style="background: white;">
                            <div class="card-body d-flex flex-column p-0">
                                <div class="stat-icon d-inline-flex align-items-center justify-content-center p-3 bg-amber-50 text-warning" style="height: 280px; width: 100%;">
                                   <img src="/img/star.png" alt="만족도" style="max-width: 240px; max-height: 240px; object-fit: contain;">
                                </div>
                                <div class="mt-auto p-4" style="background-color: #ffffff;">
                                    <h3 class="fw-bold mb-1 display-6">4.8</h3>
                                    <p class="text-muted mb-0">평균 수강 만족도</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 col-sm-6">
                        <div class="card border border-light-subtle shadow-sm h-100 text-center rounded-4 hover-lift overflow-hidden"
                            style="background: white;">
                            <div class="card-body d-flex flex-column p-0">
                                <div class="stat-icon d-inline-flex align-items-center justify-content-center p-3 bg-emerald-50 text-success" style="height: 280px; width: 100%;">
                                    <img src="/img/time.png" alt="예약시간" style="max-width: 240px; max-height: 225px; object-fit: contain;">
                                </div>
                                <div class="mt-auto p-4" style="background-color: #ffffff;">
                                    <h3 class="fw-bold mb-1 display-6">24h</h3>
                                    <p class="text-muted mb-0">언제든지 자유 예약</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Popular Subjects Section -->
        <section class="subjects-section py-5 bg-white">
            <div class="container py-4">
                <div class="text-center mb-5">
                    <h2 class="fw-bold display-6 mb-2">인기 과목</h2>
                    <p class="text-muted">다양한 분야의 전문가를 만나보세요</p>
                </div>

                <div class="row g-3">
                    <div class="col-6 col-md-3 col-lg-2"
                        th:each="item : ${ { 
                            {name: '한국어', icon: 'korea.svg'}, 
                            {name: '영어', icon: 'usa.svg'}, 
                            {name: '중국어', icon: 'china.svg'}, 
                            {name: '일본어', icon: 'japan.svg'}, 
                            {name: '스페인어', icon: 'spain.svg'}, 
                            {name: '불어', icon: 'france.svg'} 
                        } }">
                        <a href="#"
                            class="card h-100 text-decoration-none border-0 hover-lift text-center py-3 rounded-4"
                            style="transition: transform 0.2s; background: transparent;">
                            <div class="card-body p-2">
                                <div class="mb-3">
                                    <img th:src="@{/img/flag/{file}(file=${item.icon})}" th:alt="${item.name}" 
                                         style="width: 80px; height: 80px; object-fit: contain;">
                                </div>
                                <span class="fw-bold text-dark fs-5" th:text="${item.name}">과목</span>
                            </div>
                        </a>
                    </div>
                </div>

                <!-- CSS hover로 옮길 예정-->
                <script>
                    document.querySelectorAll('.hover-lift').forEach(el => {
                        el.addEventListener('mouseenter', () => { el.style.transform = 'translateY(-5px)'; el.style.boxShadow = '0 10px 20px rgba(0,0,0,0.1)'; });
                        el.addEventListener('mouseleave', () => { el.style.transform = 'none'; el.style.boxShadow = ''; });
                    });
                </script>
            </div>
        </section>
    </div>
</div>
